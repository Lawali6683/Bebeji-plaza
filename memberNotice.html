
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bebeji Leader Notice</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #1A1A2E;
            --secondary-bg: #2B2B47;
            --text-primary: #E8E8FF;
            --accent-green: #00FF99;
            --accent-blue: #4C72D6;
            --danger-red: #E74C3C;
            --shadow-color: rgba(0, 0, 0, 0.5);
            --border-color: rgba(76, 114, 214, 0.3);
            --card-radius: 15px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            text-shadow: 3px 4px 4px rgba(0, 0, 0, 0.3);
            line-height: 1.6;
        }
        
        .card {
            background-color: var(--secondary-bg);
            border-radius: var(--card-radius);
            box-shadow: 0 4px 12px var(--shadow-color);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            width: 100%;
            margin-bottom: 20px;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, rgba(255, 0, 170, 0.4) 45%, transparent 50%, transparent 95%);
            z-index: 0;
            animation: rotate-shine 15s linear infinite;
        }
        
        @keyframes rotate-shine {
            to { transform: rotate(360deg); }
        }

        .card-content {
            position: relative;
            z-index: 1;
            padding: 30px;
        }

        #authContainer {
            width: 90%;
            max-width: 400px;
            margin-top: 100px;
        }

        #mainContent {
            display: none;
            width: 95%;
            max-width: 800px;
            padding: 0;
        }

       
        .auth-form input, .action-button, .link-input {
            width: 100%;
            padding: 12px 15px;
            margin-top: 15px;
            border: 1px solid rgba(76, 114, 214, 0.5);
            border-radius: 8px;
            background-color: rgba(0, 0, 0, 0.2);
            color: var(--text-primary);
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .action-button {
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
            margin-top: 15px;
            background-color: var(--accent-blue);
        }

        #loginSubmitBtn {
            margin-top: 25px;
        }
        
       
        #noticeForm h2 {
            margin-bottom: 20px;
            color: var(--accent-green);
        }

        #textContainer {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: rgba(0, 0, 0, 0.2);
            padding: 15px;
            min-height: 200px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        #textContainer:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .toolbar button {
            background-color: var(--secondary-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .toolbar button:hover {
            background-color: var(--accent-blue);
        }

        .media-link-inputs {
            margin-top: 15px;
            border-top: 1px dashed var(--border-color);
            padding-top: 15px;
        }

        .media-link-inputs input {
            margin-top: 10px;
        }
              
        #imagePreviewContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .image-preview {
            position: relative;
            width: 100px;
            height: 100px;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid var(--accent-green);
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .remove-img-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: var(--danger-red);
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
            font-size: 0.8em;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

       
        #currentPostView h2 {
            margin-bottom: 20px;
            color: var(--accent-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .post-controls button {
            background: none;
            border: none;
            color: var(--text-primary);
            margin-left: 10px;
            cursor: pointer;
            font-size: 1.2em;
            transition: color 0.2s;
        }

        .post-controls .edit-btn:hover {
            color: var(--accent-green);
        }

        .post-controls .delete-btn:hover {
            color: var(--danger-red);
        }

        .post-meta {
            font-size: 0.8em;
            color: rgba(232, 232, 255, 0.7);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .post-content-text {
            white-space: pre-wrap;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .post-media {
            margin-top: 15px;
        }

        .post-media img, .post-media video {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 10px;
        }

        .post-media audio {
            width: 100%;
            margin-top: 10px;
        }
       
        #notificationContainer { position: fixed; top: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 12px; max-width: 380px; pointer-events: none; }
        .notification { position: relative; background-color: var(--secondary-bg); color: var(--text-primary); padding: 15px 20px; border-radius: 10px; box-shadow: 0 4px 15px var(--shadow-color); display: flex; align-items: center; gap: 15px; opacity: 0; transform: translateX(100%); animation: slideInRight 0.5s forwards; pointer-events: all; transition: all 0.3s ease; border: 1px solid rgba(76, 114, 214, 0.3); overflow: hidden; }
        .notification.success { border-left: 5px solid var(--accent-green); box-shadow: 0 4px 15px rgba(0, 255, 153, 0.3); }
        .notification.error { border-left: 5px solid var(--danger-red); box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3); }
        .notification.info { border-left: 5px solid var(--accent-blue); box-shadow: 0 4px 15px rgba(76, 114, 214, 0.3); }
        .notification .icon { font-size: 1.6em; min-width: 25px; }
        .notification.success .icon { color: var(--accent-green); }
        .notification.error .icon { color: var(--danger-red); }
        .notification.info .icon { color: var(--accent-blue); }
        .notification .message { flex-grow: 1; text-align: left; line-height: 1.4; font-size: 0.95em; }
        .notification .close-btn { background: none; border: none; color: rgba(232, 232, 255, 0.7); font-size: 1.5em; cursor: pointer; line-height: 1; transition: color 0.3s ease; padding: 0; }
        .notification .close-btn:hover { color: var(--danger-red); transform: scale(1.1); }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(100%); } }
        @media (max-width: 600px) { #notificationContainer { top: 10px; bottom: auto; left: 10px; right: 10px; max-width: none; } }
    </style>
</head>
<body>

    <div id="notificationContainer"></div>

    <div id="authContainer" class="card">
        <div class="card-content">
            <form id="loginForm" class="auth-form">
                <h2><i class="fas fa-user-lock"></i> Leader Login</h2>
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" id="loginSubmitBtn" class="action-button">Submit</button>
            </form>
        </div>
    </div>

    <div id="mainContent">

        <div id="noticeCreationCard" class="card">
            <div class="card-content">
                <h2><i class="fas fa-bullhorn"></i> Create/Edit Member Notice</h2>
                
                <form id="noticeForm">
                    <div class="toolbar">
                        <button type="button" data-command="bold"><i class="fas fa-bold"></i></button>
                        <button type="button" data-command="italic"><i class="fas fa-italic"></i></button>
                        <button type="button" data-command="underline"><i class="fas fa-underline"></i></button>
                        <button type="button" data-command="insertOrderedList"><i class="fas fa-list-ol"></i></button>
                        <button type="button" data-command="insertUnorderedList"><i class="fas fa-list-ul"></i></button>
                        <button type="button" data-command="undo"><i class="fas fa-undo"></i></button>
                        <button type="button" data-command="redo"><i class="fas fa-redo"></i></button>
                        <input type="file" id="imageUpload" accept="image/*" style="display: none;">
                        <button type="button" id="uploadImgBtn"><i class="fas fa-image"></i> Upload Image</button>
                        <button type="button" id="toggleMediaLink"><i class="fas fa-link"></i> Add Links</button>
                        <button id="logoutBtn" type="button" class="action-button" style="width: auto; background-color: var(--danger-red);">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </button>
                    </div>

                    <div id="textContainer" contenteditable="true"></div>

                    <div id="imagePreviewContainer"></div>

                    <div id="mediaLinkInputs" class="media-link-inputs" style="display: none;">
                        <input type="text" id="videoLink" class="link-input" placeholder="Video Link (YouTube, etc.)">
                        <input type="text" id="audioLink" class="link-input" placeholder="Audio Link (MP3 URL)">
                    </div>

                    <button type="submit" id="submitNoticeBtn" class="action-button">Post Notice</button>
                </form>
            </div>
        </div>
        
        <div id="currentPostViewCard" class="card">
            <div class="card-content">
                <h2 id="viewHeader">
                    Current Leader Notice
                    <div class="post-controls">
                        <button class="edit-btn" id="editPostBtn" style="display: none;"><i class="fas fa-edit"></i> Edit</button>
                        <button class="delete-btn" id="deletePostBtn" style="display: none;"><i class="fas fa-trash-alt"></i> Delete</button>
                    </div>
                </h2>
                <div id="currentPostView">
                    <p>Loading notice...</p>
                </div>
            </div>
        </div>

    </div>
    
    <script type="module">
    import { app } from './firebase.js'; 
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
    import { getDatabase, ref, get, set, remove, push } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

    const auth = getAuth(app);
    const db = getDatabase(app);

  
    const authContainer = document.getElementById('authContainer');
    const mainContent = document.getElementById('mainContent');
    const loginForm = document.getElementById('loginForm');
    const logoutBtn = document.getElementById('logoutBtn');
    const textContainer = document.getElementById('textContainer');
    const imageUpload = document.getElementById('imageUpload');
    const imagePreviewContainer = document.getElementById('imagePreviewContainer');
    const toggleMediaLinkBtn = document.getElementById('toggleMediaLink');
    const mediaLinkInputs = document.getElementById('mediaLinkInputs');
    const videoLinkInput = document.getElementById('videoLink');
    const audioLinkInput = document.getElementById('audioLink');
    const noticeForm = document.getElementById('noticeForm');
    const submitNoticeBtn = document.getElementById('submitNoticeBtn');
    const currentPostView = document.getElementById('currentPostView');
    const editPostBtn = document.getElementById('editPostBtn');
    const deletePostBtn = document.getElementById('deletePostBtn');

    let uploadedImages = [];
    let currentPostId = null;
  
    const NOTICE_DB_PATH = 'BebejiLeaderPostNotis';
    const IMGUR_CLIENT_ID = "5acf7eff9c91660";
   
    const allowedEmails = [
        'harunalawali5522@gmail.com',
        'lawaliharuna943@gmail.com',
        'bebejiplaza@gmail.com'
    ];

    function showNotification(message, type = 'info', duration = 5000) {
        const container = document.getElementById('notificationContainer');
        if (!container) return;
        const notification = document.createElement('div');
        notification.className = `notification ${type} timed`;
        let iconClass = (type === 'success') ? 'fa-check-circle' : (type === 'error') ? 'fa-exclamation-triangle' : 'fa-info-circle';
        notification.innerHTML = `
            <i class="fas ${iconClass} icon"></i>
            <div class="message">${message}</div>
            <button class="close-btn"><i class="fas fa-times"></i></button>
        `;
        container.prepend(notification);
        notification.querySelector('.close-btn').onclick = () => notification.remove();
        setTimeout(() => notification.remove(), duration);
    }

  
    onAuthStateChanged(auth, (user) => {
        if (user) {
           
            if (allowedEmails.includes(user.email.toLowerCase())) {
                authContainer.style.display = 'none';
                mainContent.style.display = 'block';
                loadCurrentNotice();
            } else {
                signOut(auth);
                showNotification("Yi hakuri! Wannan email din bashi da izinin shiga wannan shafin.");
            }
        } else {
            authContainer.style.display = 'block';
            mainContent.style.display = 'none';
        }
    });

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!allowedEmails.includes(email.toLowerCase())) {
            showNotification('Wannan email din ba a yarda da shi ba.', 'error');
            return;
        }

        try {
            document.getElementById('loginSubmitBtn').disabled = true;
            await signInWithEmailAndPassword(auth, email, password);
        } catch (error) {
            showNotification(`Login failed: ${error.message}`, 'error');
        } finally {
            document.getElementById('loginSubmitBtn').disabled = false;
        }
    });

    logoutBtn.addEventListener('click', () => signOut(auth));

       
    document.querySelectorAll('.toolbar button[data-command]').forEach(button => {
        button.addEventListener('click', () => {
            document.execCommand(button.getAttribute('data-command'), false, null);
            textContainer.focus();
        });
    });
    
    document.getElementById('uploadImgBtn').addEventListener('click', () => imageUpload.click());
    imageUpload.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onloadend = async () => {
                const base64 = reader.result.split(',')[1];
                const imgUrl = await uploadToImgur(base64);
                if (imgUrl) {
                    uploadedImages = [imgUrl]; 
                    renderImagePreviews();
                }
            };
            reader.readAsDataURL(file);
        }
    });

    async function uploadToImgur(base64) {
        showNotification('Ana saka hoto...', 'info');
        try {
            const res = await fetch("https://api.imgur.com/3/image", {
                method: "POST",
                headers: { Authorization: `Client-ID ${IMGUR_CLIENT_ID}` },
                body: new URLSearchParams({ image: base64, type: "base64" })
            });
            const data = await res.json();
            return data.success ? data.data.link : null;
        } catch { return null; }
    }

    function renderImagePreviews() {
        imagePreviewContainer.innerHTML = uploadedImages.map((url, index) => `
            <div class="image-preview">
                <img src="${url}">
                <button type="button" onclick="removeImage(${index})">×</button>
            </div>
        `).join('');
    }
    window.removeImage = (i) => { uploadedImages.splice(i, 1); renderImagePreviews(); };
   
    noticeForm.addEventListener('submit', async (e) => {
        e.preventDefault();     
        const postData = {
            text: textContainer.innerHTML.trim(),
            imageLink: uploadedImages[0] || null,
            videoLink: videoLinkInput.value.trim() || null,
            audioLink: audioLinkInput.value.trim() || null,
            postTime: Date.now()
        };

        try {
            submitNoticeBtn.disabled = true;
            if (currentPostId) await remove(ref(db, `${NOTICE_DB_PATH}/${currentPostId}`));
            await set(push(ref(db, NOTICE_DB_PATH)), postData);
            showNotification('An wallafa sakon cikin nasara!', 'success');
            resetForm();
            loadCurrentNotice();
        } catch (e) { showNotification('Error: ' + e.message, 'error'); }
        finally { submitNoticeBtn.disabled = false; }
    });

    function resetForm() {
        textContainer.innerHTML = '';
        uploadedImages = [];
        videoLinkInput.value = '';
        audioLinkInput.value = '';
        renderImagePreviews();
    }

   
    async function loadCurrentNotice() {
        try {
            const snapshot = await get(ref(db, NOTICE_DB_PATH));
            if (snapshot.exists()) {
                const data = snapshot.val();
                const latestId = Object.keys(data).sort((a,b) => data[b].postTime - data[a].postTime)[0];
                currentPostId = latestId;
                renderPost(data[latestId]);
            } else {
                currentPostView.innerHTML = "Babu sako a halin yanzu.";
            }
        } catch (e) { console.error(e); }
    }

    function renderPost(post) {
        const postDate = new Date(post.postTime).toLocaleString();
        let media = '';
        if (post.imageLink) media += `<img src="${post.imageLink}" style="width:100%; border-radius:10px; margin:10px 0;">`;
        if (post.videoLink) {
            if (post.videoLink.includes('v=')) {
                const id = post.videoLink.split('v=')[1].split('&')[0];
                media += `<iframe width="100%" height="250" src="https://www.youtube.com/embed/${id}" frameborder="0" allowfullscreen></iframe>`;
            } else {
                media += `<video src="${post.videoLink}" controls style="width:100%;"></video>`;
            }
        }
        if (post.audioLink) media += `<audio src="${post.audioLink}" controls style="width:100%;"></audio>`;
     
        
        currentPostView.innerHTML = `
            <div style="font-size:12px; color:gray;">${postDate}</div>
            <div id="actualText" style="line-height:1.6; font-size:16px; margin-top:10px;"></div>
            <div>${media}</div>
        `;
        
         document.getElementById('actualText').innerHTML = post.text;

        editPostBtn.style.display = 'inline-block';
        deletePostBtn.style.display = 'inline-block';
    }

    editPostBtn.onclick = async () => {
        const snap = await get(ref(db, `${NOTICE_DB_PATH}/${currentPostId}`));
        if (snap.exists()) {
            const d = snap.val();
            textContainer.innerHTML = d.text;
            videoLinkInput.value = d.videoLink || '';
            audioLinkInput.value = d.audioLink || '';
            uploadedImages = d.imageLink ? [d.imageLink] : [];
            renderImagePreviews();
            window.scrollTo(0,0);
        }
    };

    deletePostBtn.onclick = async () => {
        if (confirm("Kana son goge wannan?")) {
            await remove(ref(db, `${NOTICE_DB_PATH}/${currentPostId}`));
            location.reload();
        }
    };
</script>
</body>
</html>
