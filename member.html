<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEBEJI PLAZA - Shop Member Registration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
     <style>
        :root {
            --primary-bg: #1A1A2E;
            --secondary-bg: #2B2B47;
            --text-primary: #E8E8FF;
            --accent-green: #00FF99;
            --accent-blue: #4C72D6;
            --danger-red: #E74C3C;
            --success-green: #2ecc71;
            --shadow-color: rgba(0, 0, 0, 0.5);
            --input-border-color: rgba(76, 114, 214, 0.5);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--primary-bg);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            line-height: 1.6;
            background: var(--primary-bg);
            background-attachment: fixed;
        }
        .main-content {
            width: 100%;
            max-width: 700px;
            padding: 0 10px;
        }
        .header-container {
            text-align: center;
            margin-bottom: 30px;
        }
        .entrance-image {
            width: 100%;
            max-width: 450px;
            height: auto;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px var(--shadow-color);
            border: 2px solid var(--accent-blue);
            padding: 5px;
            background: linear-gradient(45deg, var(--accent-blue), var(--accent-green));
        }
        .title {
            font-size: 2.2rem;
            color: var(--accent-green);
            text-shadow: 0 0 10px rgba(0, 255, 153, 0.5);
        }
        .subtitle {
            color: var(--text-primary);
            opacity: 0.7;
            margin-top: 5px;
            font-size: 1.1rem;
        }
        .card {
            background-color: var(--secondary-bg);
            padding: 30px;
            border-radius: 15px;
            background: linear-gradient(45deg, rgba(255, 0, 170, 0.05), rgba(76, 114, 214, 0.05)), var(--secondary-bg);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
            border: 1px solid var(--input-border-color);
            position: relative;
            overflow: hidden;
        }
        .card-title {
            color: var(--accent-blue);
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--input-border-color);
            padding-bottom: 15px;
            font-size: 1.8rem;
        }
        .input-group-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .input-group-row .input-group {
            flex: 1;
            margin-bottom: 0;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .input-field-wrapper {
            position: relative;
        }
        input[type="text"], input[type="email"], input[type="tel"], input[type="password"], select, input[type="number"] {
            width: 100%;
            padding: 12px 15px 12px 40px; 
            background-color: var(--primary-bg);
            border: 1px solid var(--input-border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
            appearance: none;
        }
        select {
            cursor: pointer;
            padding-right: 15px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-green);
            box-shadow: 0 0 8px rgba(0, 255, 153, 0.4);
        }
        input[readonly] {
            opacity: 0.7;
            cursor: default;
            background-color: #151525;
        }
        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-blue);
            font-size: 0.9em;
            pointer-events: none;
        }
        .btn {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s, box-shadow 0.3s;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            background-color: var(--accent-blue);
            color: white;
        }
        .btn:hover {
            background-color: #3861c7;
            transform: translateY(-2px);
        }
        .image-upload-section {
            margin-top: 25px;
            margin-bottom: 20px;
        }
        .upload-container {
            text-align: center;
            position: relative;
        }
        .upload-container label {
            text-align: left;
            margin-bottom: 8px;
        }
        .file-input {
            display: none;
        }
        .image-preview {
            height: 180px;
            background-color: #1A1A2E;
            border: 2px dashed var(--accent-blue);
            border-radius: 10px;
            margin-top: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s;
            background-size: cover;
            background-position: center;
        }
        .wide-shape {
            width: 100%;
        }
        .image-preview::after {
            content: attr(data-placeholder);
            color: var(--text-primary);
            opacity: 0.5;
            font-size: 1em;
            position: absolute;
            padding: 0 10px;
        }
        .image-preview.has-image::after {
            content: none;
        }
        .image-preview.has-image .upload-icon {
            display: none;
        }
        .upload-icon {
            font-size: 3em;
            color: var(--accent-blue);
            transition: transform 0.3s;
        }
        .image-preview:hover .upload-icon {
            transform: scale(1.1);
        }
        .image-loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            border-radius: inherit;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--accent-green);
            font-size: 2.5em;
            z-index: 10;
        }
       
        .camera-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .camera-btn {
            flex: 1;
            padding: 10px;
            background-color: var(--accent-green);
            color: var(--primary-bg);
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .camera-btn:hover {
            background-color: #00CC77;
        }
        .camera-view-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .camera-view-container.show {
            display: flex;
        }
        #videoElement {
            max-width: 90%;
            max-height: 70vh;
            border: 5px solid var(--accent-green);
            border-radius: 15px;
            transform: scaleX(-1);
        }
        .camera-buttons {
            margin-top: 20px;
            display: flex;
            gap: 20px;
        }
        .camera-buttons button {
            padding: 15px;
            border-radius: 50%;
            border: 3px solid white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        #captureButton {
            background-color: var(--danger-red);
            color: white;
        }
        #captureButton:hover {
            background-color: #C0392B;
            transform: scale(1.1);
        }
        #switchCameraButton {
            background-color: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }
        
        .otp-input-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }
        .otp-input-group input {
            width: 45px;
            height: 50px;
            text-align: center;
            font-size: 1.5rem;
            padding: 0;
            margin: 0;
            border-radius: 8px;
        }
        .otp-verify-section {
            display: none;
        }
        .email-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .email-input-wrapper input {
            flex-grow: 1;
        }
        #emailVerificationStatus {
            position: absolute;
            right: 15px;
            font-size: 1.5em;
            color: var(--danger-red);
        }
        #emailVerificationStatus.verified {
            color: var(--success-green);
        }
        
             
    .loader-container {
        position: relative;
        width: 150px;
        height: 150px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .pulse {
        position: absolute;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        border: 3px solid #00eaff;
        animation: pulseAnim 2.5s infinite ease-in-out;
        opacity: 0.5;
    }
    @keyframes pulseAnim {
        0% { transform: scale(0.6); opacity: 0.4; }
        50% { transform: scale(1); opacity: 1; }
        100% { transform: scale(0.6); opacity: 0.4; }
    }
    .logo-wrapper {
        width: 80px;
        height: auto;
        border-radius: 10px;
        animation: floatLogo 3s infinite ease-in-out; 
        box-shadow: 0 0 10px rgba(0, 234, 255, 0.7);
    }
    @keyframes floatLogo {
        0% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
        100% { transform: translateY(0); }
    }
    .orbit {
        position: absolute;
        width: 160px;
        height: 160px;
        border-radius: 50%;
        border: 2px dashed #00eaff;
        animation: spin 5s linear infinite;
        opacity: 0.3;
    }
    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    .loading-text {
        position: absolute;
        bottom: -60px;
        width: 100%;
        text-align: center;
        font-size: 18px;
        color: #00eaff;
        letter-spacing: 2px;
        animation: fadeText 2s infinite;
    }
    @keyframes fadeText {
        0% { opacity: 0.3; }
        50% { opacity: 1; }
        100% { opacity: 0.3; }
    }
    .loader-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0e0f11, #112233, #1a2b4d, #144b7a);
        background-size: 400% 400%;
        animation: gradientMove 7s ease infinite;
        z-index: 999999;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s, visibility 0.3s;
    }
    .loader-overlay.show {
        opacity: 1;
        visibility: visible;
    }
    @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

   
    #notificationContainer {
        position: fixed;
        top: 20px; 
        right: 20px;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 380px;
        pointer-events: none; 
    }
    .notification {
        position: relative;
        background-color: var(--secondary-bg);
        color: var(--text-primary);
        padding: 15px 20px;
        border-radius: 10px;
        box-shadow: 0 4px 15px var(--shadow-color);
        display: flex;
        align-items: center;
        gap: 15px;
        opacity: 0;
        transform: translateX(100%);
        animation: slideInRight 0.5s forwards;
        pointer-events: all;
        transition: all 0.3s ease;
        border: 1px solid rgba(76, 114, 214, 0.3);
        overflow: hidden;
    }
    .notification.success {
        border-left: 5px solid var(--accent-green);
        box-shadow: 0 4px 15px rgba(0, 255, 153, 0.3);
    }
    .notification.error {
        border-left: 5px solid var(--danger-red);
        box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
    }
    .notification.info {
        border-left: 5px solid var(--accent-blue);
        box-shadow: 0 4px 15px rgba(76, 114, 214, 0.3);
    }
    .notification .icon {
        font-size: 1.6em;
        min-width: 25px; 
    }
    .notification.success .icon {
        color: var(--accent-green);
    }
    .notification.error .icon {
        color: var(--danger-red);
    }
    .notification.info .icon {
        color: var(--accent-blue);
    }
    .notification .message {
        flex-grow: 1;
        text-align: left;
        line-height: 1.4;
        font-size: 0.95em;
    }
    .notification .close-btn {
        background: none;
        border: none;
        color: rgba(232, 232, 255, 0.7);
        font-size: 1.5em;
        cursor: pointer;
        line-height: 1;
        transition: color 0.3s ease;
        padding: 0;
    }
    .notification .close-btn:hover {
        color: var(--danger-red);
        transform: scale(1.1);
    }
    @keyframes slideInRight {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }
    @keyframes fadeOut {
        from { opacity: 1; transform: translateX(0); }
        to { opacity: 0; transform: translateX(100%); }
    }
    
   
    @media (max-width: 600px) {
        body {
            padding: 10px;
            align-items: flex-start;
        }
        .main-content {
            padding: 0;
        }
        .card {
            padding: 20px;
        }
        .title {
            font-size: 1.6rem;
        }
        .subtitle {
            font-size: 0.9rem;
        }
        .input-group-row {
            flex-direction: column;
            gap: 0;
        }
        .input-group-row .input-group {
            margin-bottom: 20px;
        }
        #notificationContainer {
            top: 10px;    
            bottom: auto; 
            left: 10px;   
            right: 10px;
            max-width: none;
        }
    }
        
     
        .loader-overlay, #notificationContainer {         
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
          
        }
       
        .stage {
            display: none;
        }
        .stage.active {
            display: block;
        }
      
        @media (max-width: 600px) {
            body {
                padding: 10px;
                align-items: flex-start;
            }
            .main-content {
                padding: 0;
            }
            .card {
                padding: 20px;
            }
            .title {
                font-size: 1.6rem;
            }
            .subtitle {
                font-size: 0.9rem;
            }
            .input-group-row {
                flex-direction: column;
                gap: 0;
            }
            .input-group-row .input-group {
                margin-bottom: 20px;
            }
        }
       
    </style>
</head>
<body>

    <div id="loaderOverlay" class="loader-overlay">
        <div class="loader-container">
            <div class="orbit"></div>
            <div class="pulse"></div>
            <img class="logo-wrapper" src="https://i.imgur.com/MNooQYo.png" alt="BEBEJI Logo" />
            <div id="loadingText" class="loading-text">Processing...</div>
        </div>
    </div>
    
    <div id="notificationContainer"></div>
    <main class="main-content">
        <div class="header-container">
            <img src="https://i.imgur.com/mmiXbDo.png" alt="BEBEJI PLAZA Entrance" class="entrance-image">
            <h1 class="title">BEBEJI PLAZA PHONE CENTER GUSAU</h1>
            <p class="subtitle">Chairman Member Registration Portal</p>
        </div>

        <section id="loginStage" class="card stage active">
            <h2 class="card-title"><i class="fas fa-sign-in-alt"></i> Portal Login</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label for="loginEmail">Email Address</label>
                    <div class="input-field-wrapper">
                        <input type="email" id="loginEmail" required placeholder="Enter approved email">
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                </div>
                <div class="input-group">
                    <label for="loginPassword">Password</label>
                    <div class="input-field-wrapper">
                        <input type="password" id="loginPassword" required placeholder="Enter password">
                        <i class="fas fa-lock input-icon"></i>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-arrow-right"></i> Log In
                </button>
            </form>
        </section>

        <section id="formStage" class="card stage">
            <h2 class="card-title"><i class="fas fa-edit"></i> Shop Details</h2>
            <form id="memberForm">
                <div class="input-group">
                    <label for="fullName">Full Name</label>
                    <div class="input-field-wrapper">
                        <input type="text" id="fullName" required placeholder="Enter full legal name">
                        <i class="fas fa-user input-icon"></i>
                    </div>
                </div>
                <div class="input-group">
                    <label for="phoneNumber">Phone Number (WhatsApp & Call)</label>
                    <div class="input-field-wrapper">
                        <input type="tel" id="phoneNumber" required pattern="[0-9]{11,15}" placeholder="Enter phone number">
                        <i class="fas fa-phone input-icon"></i>
                    </div>
                </div>
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <div class="email-input-wrapper">
                        <div class="input-field-wrapper" style="flex-grow: 1;">
                            <input type="email" id="email" required placeholder="Enter email">
                            <i class="fas fa-envelope input-icon"></i>
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label for="businessName">Business Name</label>
                    <div class="input-field-wrapper">
                        <input type="text" id="businessName" required placeholder="Enter your business name">
                        <i class="fas fa-store input-icon"></i>
                    </div>
                </div>
                <div class="input-group-row">
                    <div class="input-group">
                        <label for="shopNumber">Shop Number</label>
                        <div class="input-field-wrapper">
                            <input type="text" id="shopNumber" required placeholder="e.g., BBP-23">
                            <i class="fas fa-map-marker-alt input-icon"></i>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="idCardNumber">Member ID Card Number</label>
                        <div class="input-field-wrapper">
                            <input type="text" id="idCardNumber" required placeholder="Enter unique ID number">
                            <i class="fas fa-barcode input-icon"></i>
                        </div>
                    </div>
                </div>
                <div class="input-group-row">
                    <div class="input-group">
                        <label for="country">Country</label>
                        <div class="input-field-wrapper">
                            <input type="text" id="country" value="Nigeria" readonly>
                            <i class="fas fa-globe input-icon"></i>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="state">State</label>
                        <div class="input-field-wrapper">
                            <input type="text" id="state" value="Zamfara State" readonly>
                            <i class="fas fa-city input-icon"></i>
                        </div>
                    </div>
                </div>
                <div class="input-group">
                    <label for="localGovernment">Local Government (L.G)</label>
                    <div class="input-field-wrapper">
                        <select id="localGovernment" required>
                            <option value="" disabled selected>Select Local Government</option>
                        </select>
                        <i class="fas fa-building input-icon"></i>
                    </div>
                </div>

                <h3 class="card-title" style="margin-top: 30px; font-size: 1.5rem;"><i class="fas fa-images"></i> Image Uploads</h3>
                
                <div class="image-upload-section">
                    <label>ID Card Photo (Take a wide, clear photo of the ID Card)</label>
                    <div class="camera-controls">
                        <button type="button" class="camera-btn" data-target="idCardImage" data-shape="wide"><i class="fas fa-camera"></i> Take Photo (ID Card 💳)</button>
                        <input type="file" id="idCardImageInput" accept="image/*" class="file-input" required>
                        <button type="button" class="camera-btn" onclick="document.getElementById('idCardImageInput').click();"><i class="fas fa-upload"></i> Upload File</button>
                    </div>
                    <div id="idCardImagePreview" class="image-preview wide-shape" data-placeholder="ID Card Photo Preview">
                        <i class="fas fa-id-card upload-icon"></i>
                    </div>
                    <input type="hidden" id="idCardImageLink" required>
                </div>
                
                <div class="image-upload-section">
                    <label>User Face Photo (Take a clear photo of your face)</label>
                    <div class="camera-controls">
                        <button type="button" class="camera-btn" data-target="userImage" data-shape="square"><i class="fas fa-camera"></i> Take Photo (Face 👤)</button>
                        <input type="file" id="userImageInput" accept="image/*" class="file-input" required>
                        <button type="button" class="camera-btn" onclick="document.getElementById('userImageInput').click();"><i class="fas fa-upload"></i> Upload File</button>
                    </div>
                    <div id="userImagePreview" class="image-preview" data-placeholder="User Face Photo Preview">
                        <i class="fas fa-user-circle upload-icon"></i>
                    </div>
                    <input type="hidden" id="userImageLink" required>
                </div>

                <div class="image-upload-section">
                    <label>Shop Photo (Take a wide, clear photo of the Shop 🏪)</label>
                    <div class="camera-controls">
                        <button type="button" class="camera-btn" data-target="shopImage" data-shape="wide"><i class="fas fa-camera"></i> Take Photo (Shop 🏪)</button>
                        <input type="file" id="shopImageInput" accept="image/*" class="file-input" required>
                        <button type="button" class="camera-btn" onclick="document.getElementById('shopImageInput').click();"><i class="fas fa-upload"></i> Upload File</button>
                    </div>
                    <div id="shopImagePreview" class="image-preview wide-shape" data-placeholder="Shop Photo Preview">
                        <i class="fas fa-store upload-icon"></i>
                    </div>
                    <input type="hidden" id="shopImageLink" required>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Submit Registration Data
                </button>
            </form>
        </section>
    </main>

    <div id="cameraViewContainer" class="camera-view-container">
        <canvas id="canvasElement" style="display:none;"></canvas>
        <video id="videoElement" autoplay playsinline></video>
        <div class="camera-buttons">
            <button id="switchCameraButton" title="Switch Camera"><i class="fas fa-sync-alt"></i></button>
            <button id="captureButton" title="Take Photo"><i class="fas fa-circle"></i></button>
            <button id="cancelButton" title="Cancel" style="background-color: var(--danger-red); border-color: var(--danger-red);"><i class="fas fa-times"></i></button>
        </div>
    </div>
    
    <script type="module">
import { app } from './firebase.js'; 
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";


const API_MEMBER_URL = "https://bebejiplaza.pages.dev/api/member";

const ZAMFARA_LGS = ["Anka", "Bakura", "Birnin Magaji/Kiyaw", "Bukkuyum", "Bungudu", "Gummi", "Gusau", "Kaura Namoda", "Maradun", "Maru", "Shinkafi", "Talata Mafara", "Chafe", "Zurmi"];

const auth = getAuth(app);


const loaderOverlay = document.getElementById('loaderOverlay');
const loadingText = document.getElementById('loadingText');
const loginStage = document.getElementById('loginStage');
const formStage = document.getElementById('formStage');
const memberForm = document.getElementById('memberForm');


const imageTargets = {
    idCardImage: { input: 'idCardImageInput', preview: 'idCardImagePreview' },
    userImage: { input: 'userImageInput', preview: 'userImagePreview' },
    shopImage: { input: 'shopImageInput', preview: 'shopImagePreview' }
};


const cameraViewContainer = document.getElementById('cameraViewContainer');
const videoElement = document.getElementById('videoElement');
const canvasElement = document.getElementById('canvasElement');
const captureButton = document.getElementById('captureButton');
const cancelButton = document.getElementById('cancelButton');

let currentImageTarget = '';
let stream = null;


function toggleLoader(show, text = "Processing...") {
    loaderOverlay.classList.toggle('show', show);
    loadingText.textContent = text;
}

function showNotification(message, type = 'info') {
    const container = document.getElementById('notificationContainer');
    const div = document.createElement('div');
    div.className = `notification ${type}`;
    div.innerHTML = `<span>${message}</span><button onclick="this.parentElement.remove()">&times;</button>`;
    container.appendChild(div);
    setTimeout(() => div.remove(), 6000);
}


function updatePreview(targetKey, file) {
    const preview = document.getElementById(imageTargets[targetKey].preview);
    const reader = new FileReader();
    reader.onload = (e) => {
        preview.style.backgroundImage = `url(${e.target.result})`;
        preview.classList.add('has-image');
    };
    reader.readAsDataURL(file);
}

 
async function uploadToImgur(file) {
    if (!file) return null;
    const formData = new FormData();
    formData.append('image', file);
    
    const res = await fetch('https://api.imgur.com/3/image', {
        method: 'POST',
        headers: { Authorization: `Client-ID ${IMGUR_CLIENT_ID}` },
        body: formData
    });
    const data = await res.json();
    if (!res.ok) throw new Error("Imgur Error: " + data.data.error);
    return data.data.link;
}


async function startCamera(target) {
    currentImageTarget = target;
    const mode = target === 'userImage' ? 'user' : 'environment';
    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: mode } });
        videoElement.srcObject = stream;
        cameraViewContainer.classList.add('show');
    } catch (err) {
        showNotification("Camera failed: " + err.message, "error");
    }
}

function stopCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    cameraViewContainer.classList.remove('show');
}

captureButton.onclick = () => {
    const ctx = canvasElement.getContext('2d');
    canvasElement.width = videoElement.videoWidth;
    canvasElement.height = videoElement.videoHeight;
    ctx.drawImage(videoElement, 0, 0);
    
    canvasElement.toBlob((blob) => {
        const file = new File([blob], `${currentImageTarget}.jpg`, { type: "image/jpeg" });
        const input = document.getElementById(imageTargets[currentImageTarget].input);
              
        const container = new DataTransfer();
        container.items.add(file);
        input.files = container.files;
        
        updatePreview(currentImageTarget, file);
        stopCamera();
    }, 'image/jpeg');
};

cancelButton.onclick = stopCamera;

document.addEventListener('DOMContentLoaded', () => {
   
    ZAMFARA_LGS.forEach(lg => {
        const opt = document.createElement('option');
        opt.value = lg; opt.textContent = lg;
        document.getElementById('localGovernment').appendChild(opt);
    });

       document.querySelectorAll('.camera-btn[data-target]').forEach(btn => {
        btn.onclick = () => startCamera(btn.dataset.target);
    });

    
    Object.keys(imageTargets).forEach(key => {
        const input = document.getElementById(imageTargets[key].input);
        input.onchange = (e) => {
            if (e.target.files[0]) updatePreview(key, e.target.files[0]);
        };
    });

    
    memberForm.onsubmit = async (e) => {
        e.preventDefault();
      
        const idFile = document.getElementById(imageTargets.idCardImage.input).files[0];
        const userFile = document.getElementById(imageTargets.userImage.input).files[0];
        const shopFile = document.getElementById(imageTargets.shopImage.input).files[0];

        if (!idFile || !userFile || !shopFile) {
            showNotification("Please provide all 3 images (ID, Face, and Shop).", "error");
            return;
        }

        toggleLoader(true, "Uploading images to Imgur...");

        try {
           
            const idLink = await uploadToImgur(idFile);
            toggleLoader(true, "Uploading Face Photo...");
            const userLink = await uploadToImgur(userFile);
            toggleLoader(true, "Uploading Shop Photo...");
            const shopLink = await uploadToImgur(shopFile);

            // 3. Tura data zuwa API
            toggleLoader(true, "Saving Member Data...");
            const formData = {
                fullName: document.getElementById('fullName').value,
                phoneNumber: document.getElementById('phoneNumber').value,
                businessName: document.getElementById('businessName').value,
                shopNumber: document.getElementById('shopNumber').value,
                idCardNumber: document.getElementById('idCardNumber').value,
                email: document.getElementById('email').value,
                country: document.getElementById('country').value,
                state: document.getElementById('state').value,
                lg: document.getElementById('localGovernment').value,
                idCardImageLink: idLink,
                userImageLink: userLink,
                shopImageLink: shopLink
            };

            const res = await fetch(API_MEMBER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
                body: JSON.stringify(formData)
            });

            if (!res.ok) throw new Error("API Submission Failed");

            showNotification("Registration Successful!", "success");
            setTimeout(() => location.reload(), 2000);

        } catch (err) {
            showNotification(err.message, "error");
        } finally {
            toggleLoader(false);
        }
    };
});

document.getElementById('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    toggleLoader(true, "Checking Access...");
    try {
        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPassword').value;
        const cred = await signInWithEmailAndPassword(auth, email, pass);
        if (ALLOWED_USERS.includes(cred.user.email)) {
            loginStage.classList.remove('active');
            formStage.classList.add('active');
        } else {
            await signOut(auth);
            showNotification("Unauthorized user.", "error");
        }
    } catch (err) {
        showNotification(err.message, "error");
    } finally {
        toggleLoader(false);
    }
};
</script>
