<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEBEJI PLAZA - New Registration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>  
    :root {
        --primary-bg: #1A1A2E;
        --secondary-bg: #2B2B47;
        --text-primary: #E8E8FF;
        --accent-green: #00FF99;
        --accent-blue: #4C72D6;
        --danger-red: #E74C3C;
        --shadow-color: rgba(0, 0, 0, 0.5);
        --input-border-color: rgba(76, 114, 214, 0.5);
    }
    
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    } 
    
     body {
    background-color: var(--primary-bg);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 0;
    line-height: 1.6;
    font-size: 16px;    
    text-shadow: 3px 4px 4px rgba(0, 0, 0, 0.3);    
    background-color: var(--primary-bg);      
    background-image: 
        linear-gradient(45deg, var(--secondary-bg) 25%, transparent 25%), 
        linear-gradient(-45deg, var(--secondary-bg) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--secondary-bg) 75%),
        linear-gradient(-45deg, transparent 75%, var(--secondary-bg) 75%);        
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;  
    background-image:        
        linear-gradient(rgba(26, 26, 46, 0.7), rgba(26, 26, 46, 0.7)),        
        linear-gradient(45deg, var(--secondary-bg) 25%, transparent 25%), 
        linear-gradient(-45deg, var(--secondary-bg) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--secondary-bg) 75%),
        linear-gradient(-45deg, transparent 75%, var(--secondary-bg) 75%);            
    background-size: 100% 100%, 20px 20px, 20px 20px, 20px 20px, 20px 20px;
    background-position: 0 0, 0 0, 0 10px, 10px -10px, -10px 0px;       
    background-attachment: scroll;        
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    margin: 0;
    overflow-y: auto;
    overflow-x: hidden;
}

    .main-content {
        width: 100%;
        max-width: 600px;
        padding: 0 10px;
    }
  
    .header-container {
        text-align: center;
        margin-bottom: 30px;
    }

    .entrance-image {
        width: 100%;
        max-width: 450px;
        height: auto;
        border-radius: 15px;
        margin-bottom: 20px;
        box-shadow: 0 10px 30px var(--shadow-color);
        border: 2px solid var(--accent-blue);      
        padding: 5px;
        background: linear-gradient(45deg, var(--accent-blue), var(--accent-green));
    }
    
    .title {
        font-size: 2.2rem;
        color: var(--accent-green);
        text-shadow: 0 0 10px rgba(0, 255, 153, 0.5);
    }
    .subtitle {
        color: var(--text-primary);
        opacity: 0.7;
        margin-top: 5px;
    }

 
    .card {
        background-color: var(--secondary-bg);
        padding: 30px;
                border-radius: 15px;
                
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
        border: 1px solid var(--input-border-color);
        position: relative;
        overflow: hidden;       
          background-color: var(--secondary-bg);            
            background: conic-gradient(
          transparent, 
                rgba(255, 0, 170, 0.6) 45%, 
                transparent 50%,
                transparent 95%
            );
            z-index: 0;
            animation: rotate-shine 15s linear infinite;                        
            box-shadow: 0 4px 12px var(--shadow-color);
            border: 1px solid rgba(76, 114, 214, 0.3);
                                            
    }
    
               
    .card-title {
        color: var(--accent-blue);
        text-align: center;
        margin-bottom: 25px;
        border-bottom: 2px solid var(--input-border-color);
        padding-bottom: 15px;
        font-size: 1.5rem;
    }
  
    
    .input-group {
        margin-bottom: 20px;
    }
    .input-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: var(--text-primary);
    }
    .input-field-wrapper {
        position: relative;
    }
    input[type="text"], input[type="email"], input[type="tel"], input[type="password"] {
        width: 100%;
        padding: 12px 15px 12px 40px;
        background-color: var(--primary-bg);
        border: 1px solid var(--input-border-color);
        border-radius: 8px;
        color: var(--text-primary);
        font-size: 1rem;
        transition: border-color 0.3s, box-shadow 0.3s;
    }
    input:focus {
        outline: none;
        border-color: var(--accent-green);
        box-shadow: 0 0 8px rgba(0, 255, 153, 0.4);
    }
    input[readonly] {
        opacity: 0.6;
        cursor: default;
        background-color: #151525;
    }
    .input-icon {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--accent-blue);
        font-size: 0.9em;
    }
    .required {
        color: var(--danger-red);
    }
      
    .toggle-password {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--text-primary);
        cursor: pointer;
        font-size: 1.1em;
        padding: 5px;
    }

   
    .btn {
        width: 100%;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        font-size: 1.1rem;
        cursor: pointer;
        transition: background-color 0.3s, transform 0.2s, box-shadow 0.3s;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 15px;
    }
    .btn-primary {
        background-color: var(--accent-blue);
        color: white;
    }
    .btn-primary:hover {
        background-color: #3861c7;
        transform: translateY(-2px);
    }
    .btn-success {
        background-color: var(--accent-green);
        color: var(--primary-bg);
    }
    .btn-success:hover {
        background-color: #00e88a;
        transform: translateY(-2px);
    }

    .login-prompt {
        text-align: center;
        margin-top: 20px;
        font-size: 0.9em;
    }
    .login-prompt a {
        color: var(--accent-green);
        text-decoration: none;
        font-weight: 600;
    }

    .image-upload-section {
        display: flex;
        justify-content: space-around;
        gap: 20px;
        margin-bottom: 25px;
    }
    .upload-container {
        flex: 1;
        text-align: center;
        position: relative;
    }
    .upload-container label {
        text-align: left;
    }
    .file-input {
        display: none;
    }
    .image-preview {
        width: 100%;
        height: 120px;
        background-color: #1A1A2E;
        border: 2px dashed var(--accent-blue);
        border-radius: 10px;
        margin-top: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: border-color 0.3s;
        background-size: cover;
        background-position: center;
    }
    .image-preview::after {
        content: attr(data-placeholder);
        color: var(--text-primary);
        opacity: 0.5;
        font-size: 0.8em;
        position: absolute;
    }
    .image-preview.has-image::after {
        content: none;
    }
    .image-preview.has-image .upload-icon {
        display: none;
    }
    .profile-shape {
        border-radius: 50%;
        height: 120px;
        width: 120px;
        margin-left: auto;
        margin-right: auto;
    }
    .upload-icon {
        font-size: 2.5em;
        color: var(--accent-blue);
        transition: transform 0.3s;
    }
    .image-preview:hover .upload-icon {
        transform: scale(1.1);
    }
    
    .image-loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        border-radius: inherit;
        display: flex;
        justify-content: center;
        align-items: center;
        color: var(--accent-green);
        font-size: 2em;
        z-index: 10;
    }
    .profile-shape + .image-loading-overlay {
        border-radius: 50%;
    }


    .loader-container {
        position: relative;
        width: 150px;
        height: 150px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .pulse {
        position: absolute;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        border: 3px solid #00eaff;
        animation: pulseAnim 2.5s infinite ease-in-out;
        opacity: 0.5;
    }
    @keyframes pulseAnim {
        0% { transform: scale(0.6); opacity: 0.4; }
        50% { transform: scale(1); opacity: 1; }
        100% { transform: scale(0.6); opacity: 0.4; }
    }
    .logo-wrapper {
        width: 80px;
        height: auto;
        border-radius: 10px;
        animation: floatLogo 3s infinite ease-in-out; 
        box-shadow: 0 0 10px rgba(0, 234, 255, 0.7);
    }
    @keyframes floatLogo {
        0% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
        100% { transform: translateY(0); }
    }
    .orbit {
        position: absolute;
        width: 160px;
        height: 160px;
        border-radius: 50%;
        border: 2px dashed #00eaff;
        animation: spin 5s linear infinite;
        opacity: 0.3;
    }
    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    .loading-text {
        position: absolute;
        bottom: -60px;
        width: 100%;
        text-align: center;
        font-size: 18px;
        color: #00eaff;
        letter-spacing: 2px;
        animation: fadeText 2s infinite;
    }
    @keyframes fadeText {
        0% { opacity: 0.3; }
        50% { opacity: 1; }
        100% { opacity: 0.3; }
    }
    .loader-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0e0f11, #112233, #1a2b4d, #144b7a);
        background-size: 400% 400%;
        animation: gradientMove 7s ease infinite;
        z-index: 999999;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s, visibility 0.3s;
    }
    .loader-overlay.show {
        opacity: 1;
        visibility: visible;
    }
    @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

 
    #notificationContainer {
        position: fixed;
        top: 20px; 
        right: 20px;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 380px;
        pointer-events: none; 
    }
    .notification {
        position: relative;
        background-color: var(--secondary-bg);
        color: var(--text-primary);
        padding: 15px 20px;
        border-radius: 10px;
        box-shadow: 0 4px 15px var(--shadow-color);
        display: flex;
        align-items: center;
        gap: 15px;
        opacity: 0;
        transform: translateX(100%);
        animation: slideInRight 0.5s forwards;
        pointer-events: all;
        transition: all 0.3s ease;
        border: 1px solid rgba(76, 114, 214, 0.3);
        overflow: hidden;
    }
    .notification.success {
        border-left: 5px solid var(--accent-green);
        box-shadow: 0 4px 15px rgba(0, 255, 153, 0.3);
    }
    .notification.error {
        border-left: 5px solid var(--danger-red);
        box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
    }
    .notification.info {
        border-left: 5px solid var(--accent-blue);
        box-shadow: 0 4px 15px rgba(76, 114, 214, 0.3);
    }
    .notification .icon {
        font-size: 1.6em;
        min-width: 25px; 
    }
    .notification.success .icon {
        color: var(--accent-green);
    }
    .notification.error .icon {
        color: var(--danger-red);
    }
    .notification.info .icon {
        color: var(--accent-blue);
    }
    .notification .message {
        flex-grow: 1;
        text-align: left;
        line-height: 1.4;
        font-size: 0.95em;
    }
    .notification .close-btn {
        background: none;
        border: none;
        color: rgba(232, 232, 255, 0.7);
        font-size: 1.5em;
        cursor: pointer;
        line-height: 1;
        transition: color 0.3s ease;
        padding: 0;
    }
    .notification .close-btn:hover {
        color: var(--danger-red);
        transform: scale(1.1);
    }
    @keyframes slideInRight {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }
    @keyframes fadeOut {
        from { opacity: 1; transform: translateX(0); }
        to { opacity: 0; transform: translateX(100%); }
    }
    .notification.timed::after {
        content: '';
        position: absolute;
        left: 0;
        bottom: 0;
        height: 3px;
        width: 100%;
        background-color: rgba(255, 255, 255, 0.1);
    }
    .notification.timed .progress-bar {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 3px;
        background-color: currentColor; 
        animation: shrink-width var(--notification-duration) linear forwards;
        width: 100%;
    }
    @keyframes shrink-width {
        from { width: 100%; }
        to { width: 0%; }
    }

   
    @media (max-width: 600px) {
        body {
            padding: 10px;
            align-items: flex-start; 
        }
        .main-content {
            padding: 0;
        }
        .card {
            padding: 20px;
        }
        .title {
            font-size: 1.1rem;
        }
        .image-upload-section {
            flex-direction: column;
        }
        .upload-container {
            flex: none;
            width: 100%;
            margin-bottom: 20px;
        }
        .profile-shape {
            margin-left: auto;
            margin-right: auto;
        }
        #notificationContainer {
            top: 10px;    
            bottom: auto; 
            left: 10px;   
            right: 10px;
            max-width: none;
        }
    }

    display: flex;

</style>
</head>

</div>

<div id="notificationContainer"></div>
<main class="main-content">
    <div class="header-container">
        <img src="https://i.imgur.com/mmiXbDo.png" alt="BEBEJI PLAZA Entrance" class="entrance-image">
        <h1 class="title">BEBEJI PLAZA Registration Shop Services</h1>
        <p class="subtitle">Secure your shop and profile today.</p>
    </div>
    
    <section id="stage1" class="card form-stage active">
        <h2 class="card-title"><i class="fas fa-id-card"></i> Verify Your Member ID</h2>
        <form id="idVerificationForm">
            <div class="input-group">
                <label for="idCardNumber">Bebeji ID Card Number</label>
                <div class="input-field-wrapper">
                    <input type="text" id="idCardNumber" required placeholder="e.g., BBP-23-Gusau-101">
                    <i class="fas fa-barcode input-icon"></i>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-arrow-right"></i> Verify ID & Continue
            </button>
        </form>
    </section>
    
    <section id="stage2" class="card form-stage" style="display: none;">
        <h2 class="card-title"><i class="fas fa-user-plus"></i> Complete Your Profile</h2>
        <form id="registrationForm">
            
            <div id="imageUploadWrapper" class="image-upload-wrapper">
                <div id="shopUploadContainer" class="upload-container required-upload">
                    <label>Shop Photo <span class="required">*</span></label>
                    <input type="file" id="shopImageInput" accept="image/*" class="file-input" required>
                    <div id="shopImagePreview" class="image-preview" data-placeholder="Shop Front Photo">
                        <i class="fas fa-camera upload-icon"></i>
                    </div>
                    <div id="shopImageLoading" class="image-loading-overlay" style="display:none;">
                        <i class="fas fa-spinner fa-spin"></i>
                    </div>
                </div>
                
                <div id="userUploadContainer" class="upload-container required-upload">
                    <label>Profile Photo <span class="required">*</span></label>
                    <input type="file" id="userImageInput" accept="image/*" class="file-input" required>
                    <div id="userImagePreview" class="image-preview profile-shape" data-placeholder="Your Profile Photo">
                        <i class="fas fa-camera upload-icon"></i>
                    </div>
                    <div id="userImageLoading" class="image-loading-overlay" style="display:none;">
                        <i class="fas fa-spinner fa-spin"></i>
                    </div>
                </div>
            </div>
            <input type="hidden" id="regIdCardNumber">
            <input type="hidden" id="finalShopImageLink">
            <input type="hidden" id="finalUserImageLink">
            
            <div class="input-group">
                <label for="regFullName">Full Name</label>
                <div class="input-field-wrapper">
                    <input type="text" id="regFullName" readonly>
                    <i class="fas fa-user input-icon"></i>
                </div>
            </div>
            
            <div class="input-group">
                <label for="regBusinessName">Business Name</label>
                <div class="input-field-wrapper">
                    <input type="text" id="regBusinessName" readonly>
                    <i class="fas fa-store input-icon"></i>
                </div>
            </div>
            
            <div class="input-group">
                <label for="regPhoneNumber">Phone Number</label>
                <div class="input-field-wrapper">
                    <input type="tel" id="regPhoneNumber" readonly>
                    <i class="fas fa-phone input-icon"></i>
                </div>
            </div>
            
            <div class="input-group">
                <label for="regEmail">Email Address</label>
                <div class="input-field-wrapper">
                    <input type="email" id="regEmail" readonly>
                    <i class="fas fa-envelope input-icon"></i>
                </div>
            </div>
            
            <div class="input-group">
                <label for="regShopNumber">Shop Number</label>
                <div class="input-field-wrapper">
                    <input type="text" id="regShopNumber" readonly>
                    <i class="fas fa-map-marker-alt input-icon"></i>
                </div>
            </div>
            
            <div class="input-group">
                <label for="password">Create Password <span class="required">*</span></label>
                <div class="input-field-wrapper">
                    <input type="password" id="password" required minlength="6" placeholder="Must be at least 6 characters">
                    <i class="fas fa-lock input-icon"></i>
                    <button type="button" class="toggle-password" onclick="togglePassword('password')"><i class="fas fa-eye"></i></button>
                </div>
            </div>
            
            <div class="input-group">
                <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
                <div class="input-field-wrapper">
                    <input type="password" id="confirmPassword" required minlength="6" placeholder="Confirm your password">
                    <i class="fas fa-lock input-icon"></i>
                    <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')"><i class="fas fa-eye"></i></button>
                </div>
            </div>
            
            <button type="submit" class="btn btn-success">
                <i class="fas fa-check-circle"></i> Complete Registration
            </button>
        </form>
        <p class="login-prompt">Already Registered? <a href="login.html">Login Here</a></p>
    </section>
</main>

    const notification = document.createElement('div');
    notification.classList.add('notification', type);
    let iconClass = type === 'success' ? 'fa-check-circle' : (type === 'error' ? 'fa-times-circle' : 'fa-info-circle');
    notification.innerHTML = `
        <i class="fas ${iconClass} icon"></i>
        <span class="message">${message}</span>
        <button class="close-btn">&times;</button>
        ${duration > 0 ? `<div class="progress-bar"></div>` : ''}
    `;
    container.appendChild(notification);
    const closeNotification = () => {
        notification.style.animation = 'fadeOut 0.5s forwards';
        setTimeout(() => notification.remove(), 500);
    };
    notification.querySelector('.close-btn').addEventListener('click', closeNotification);
    if (duration > 0) {
        notification.style.setProperty('--notification-duration', `${duration / 1000}s`);
        setTimeout(closeNotification, duration);
    }
}

function toggleLoader(show, text = "Loading...") {
    loaderOverlay.classList.toggle('show', show);
    loadingText.textContent = text;
}

window.togglePassword = function(fieldId) {
    const field = document.getElementById(fieldId);
    const toggleButton = field.nextElementSibling.nextElementSibling;
    if (field.type === "password") {
        field.type = "text";
        toggleButton.innerHTML = '<i class="fas fa-eye-slash"></i>';
    } else {
        field.type = "password";
        toggleButton.innerHTML = '<i class="fas fa-eye"></i>';
    }
};

function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

async function uploadToImgur(base64) {
    const res = await fetch("https://api.imgur.com/3/image", {
        method: "POST",
        headers: { Authorization: `Client-ID ${IMGUR_CLIENT_ID}` },
        body: new URLSearchParams({ image: base64, type: "base64" })
    });
    if (!res.ok) {
        const errorData = await res.json();
        throw new Error(errorData.data.error || 'Imgur upload failed.');
    }
    const data = await res.json();
    return data.data.link;
}

function checkAndSetImagePreview(imageLink, previewEl, inputEl, linkEl, containerEl) {
    if (imageLink && imageLink.startsWith('http')) {
        previewEl.style.backgroundImage = `url(${imageLink})`;
        previewEl.classList.add('has-image');
        linkEl.value = imageLink;
        containerEl.style.display = 'none';
        inputEl.removeAttribute('required');
        return true;
    } else {
        previewEl.style.backgroundImage = 'none';
        previewEl.classList.remove('has-image');
        linkEl.value = '';
        containerEl.style.display = 'flex';
        inputEl.setAttribute('required', 'required');
        return false;
    }
}

function setupImageUpload(inputEl, previewEl, loadingEl, linkEl, containerEl, isProfile = false) {
    previewEl.addEventListener('click', () => inputEl.click());
    inputEl.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
            loadingEl.style.display = 'flex';
            const base64 = await fileToBase64(file);
            const imageUrl = await uploadToImgur(base64);
            previewEl.style.backgroundImage = `url(${imageUrl})`;
            previewEl.classList.add('has-image');
            linkEl.value = imageUrl;
            showNotification(`${isProfile ? 'Profile' : 'Shop'} image uploaded successfully!`, 'success', 3000);
        } catch (error) {
            showNotification(error.message, 'error', 6000);
            previewEl.style.backgroundImage = 'none';
            previewEl.classList.remove('has-image');
            inputEl.value = null;
            linkEl.value = '';
        } finally {
            loadingEl.style.display = 'none';
        }
    });
}

idVerificationForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const idCardNumber = document.getElementById('idCardNumber').value.trim();
    if (!idCardNumber) {
        showNotification('Please enter your Member ID Card Number.', 'error', 4000);
        return;
    }
    toggleLoader(true, 'Verifying Member ID Card...');
    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
            body: JSON.stringify({ idCardNumber })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Verification failed.');
        memberData = data.member;
        regIdCardNumber.value = idCardNumber;
        document.getElementById('regFullName').value = memberData.fullName || '';
        document.getElementById('regBusinessName').value = memberData.businesName || '';
        document.getElementById('regPhoneNumber').value = memberData.phoneNumber || '';
        document.getElementById('regEmail').value = memberData.email || '';
        document.getElementById('regShopNumber').value = memberData.bebejiShopNumber || '';
        const shopImg = checkAndSetImagePreview(memberData.shopImageLink, shopImagePreview, shopImageInput, finalShopImageLink, shopUploadContainer);
        const userImg = checkAndSetImagePreview(memberData.userImageLink, userImagePreview, userImageInput, finalUserImageLink, userUploadContainer);
        stage1.style.display = 'none';
        stage2.style.display = 'block';
        showNotification(`Welcome, ${memberData.fullName}! Complete your profile below.`, 'success', 5000);
        imageUploadWrapper.style.display = (!shopImg || !userImg) ? 'flex' : 'none';
    } catch (error) {
        showNotification("Invalid Member ID or Connection Error. Please try again.", "error", 8000);
    } finally {
        toggleLoader(false);
    }
});

registrationForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('regEmail').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    if (password !== confirmPassword) {
        showNotification('Passwords do not match.', 'error', 5000);
        return;
    }
    if (!finalShopImageLink.value || !finalUserImageLink.value) {
        showNotification('Please upload both photos.', 'error', 6000);
        return;
    }
    toggleLoader(true, 'Creating account...');
    let authUser = null;
    try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        authUser = userCredential.user;
        const uid = authUser.uid;
        await updateProfile(authUser, { displayName: memberData.fullName, photoURL: finalUserImageLink.value });
        const shopNumber = memberData.bebejiShopNumber || "NA";
        const userData = {
            uid: uid,
            email: email,
            fullName: memberData.fullName,
            businessName: memberData.businesName,
            phoneNumber: memberData.phoneNumber,
            bebejiShopNumber: shopNumber,
            state: memberData.state || "",
            lg: memberData.lg || "",
            idcardNumber: regIdCardNumber.value,
            shopImageLink: finalShopImageLink.value,
            userImageLink: finalUserImageLink.value,
            shopLink: `https://bebejiplaza.pages.dev/#/shop/${shopNumber}/${uid}`,
            registerTime: new Date().toLocaleString("en-US", { timeZone: "Africa/Lagos" }),
            isProfilePublic: true
        };
        await set(ref(db, 'users/' + uid), userData);
        registrationForm.reset();
        loaderOverlay.innerHTML = `<div class="loader-content"><i class="fas fa-check-circle" style="font-size: 2em; color: green;"></i><br><br>Success! Redirecting...</div>`;
        setTimeout(() => window.location.href = 'login.html', 3000);
    } catch (error) {
        if (authUser) await deleteUser(authUser).catch(() => {});
        let msg = error.code === 'auth/email-already-in-use' ? "Email already registered." : "Registration failed. Try again.";
        showNotification(msg, 'error', 7000);
    } finally {
        toggleLoader(false);
    }
});

document.addEventListener('DOMContentLoaded', () => {
    toggleLoader(false); 
    setupImageUpload(shopImageInput, shopImagePreview, shopImageLoading, finalShopImageLink, shopUploadContainer, false);
    setupImageUpload(userImageInput, userImagePreview, userImageLoading, finalUserImageLink, userUploadContainer, true);
});
</script>
