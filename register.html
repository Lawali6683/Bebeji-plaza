    .loader-container {

    .pulse {
        position: absolute;

        height: 140px;
        border-radius: 50%;
        border: 3px solid #00eaff;
        animation: pulseAnim 2.5s infinite ease-in-out;
        opacity: 0.5;
    }
    @keyframes pulseAnim {
        0% { transform: scale(0.6); opacity: 0.4; }
        50% { transform: scale(1); opacity: 1; }
        100% { transform: scale(0.6); opacity: 0.4; }
    }
    .logo-wrapper {
        width: 80px;

    @keyframes floatLogo {
        0% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
        100% { transform: translateY(0); }
    }
    .orbit {
        position: absolute;
        width: 160px;
        height: 160px;
        border-radius: 50%;
        border: 2px dashed #00eaff;
        animation: spin 5s linear infinite;
        opacity: 0.3;
    }
    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    .loading-text {
        position: absolute;
        bottom: -60px;
        width: 100%;
        text-align: center;

        color: #00eaff;
        letter-spacing: 2px;

    }
    @keyframes fadeText {
        0% { opacity: 0.3; }
        50% { opacity: 1; }

    }
    .loader-overlay {

        top: 0;
        left: 0;
        width: 100%;
        height: 100%;

        justify-content: center;
        align-items: center;

        background-size: 400% 400%;
        animation: gradientMove 7s ease infinite;
        z-index: 999999;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s, visibility 0.3s;
    }
    .loader-overlay.show {
        opacity: 1;
        visibility: visible;
    }
    @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

 
    #notificationContainer {
        position: fixed;
        top: 20px; 
        right: 20px;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 380px;
        pointer-events: none; 
    }
    .notification {
        position: relative;
        background-color: var(--secondary-bg);
        color: var(--text-primary);
        padding: 15px 20px;
        border-radius: 10px;
        box-shadow: 0 4px 15px var(--shadow-color);
        display: flex;
        align-items: center;
        gap: 15px;
        opacity: 0;
        transform: translateX(100%);
        animation: slideInRight 0.5s forwards;
        pointer-events: all;
        transition: all 0.3s ease;
        border: 1px solid rgba(76, 114, 214, 0.3);
        overflow: hidden;
    }
    .notification.success {
        border-left: 5px solid var(--accent-green);
        box-shadow: 0 4px 15px rgba(0, 255, 153, 0.3);
    }
    .notification.error {
        border-left: 5px solid var(--danger-red);
        box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
    }
    .notification.info {
        border-left: 5px solid var(--accent-blue);
        box-shadow: 0 4px 15px rgba(76, 114, 214, 0.3);
    }
    .notification .icon {
        font-size: 1.6em;
        min-width: 25px; 
    }
    .notification.success .icon {
        color: var(--accent-green);
    }
    .notification.error .icon {
        color: var(--danger-red);
    }
    .notification.info .icon {
        color: var(--accent-blue);
    }
    .notification .message {
        flex-grow: 1;
        text-align: left;
        line-height: 1.4;
        font-size: 0.95em;
    }
    .notification .close-btn {
        background: none;
        border: none;
        color: rgba(232, 232, 255, 0.7);
        font-size: 1.5em;
        cursor: pointer;
        line-height: 1;
        transition: color 0.3s ease;
        padding: 0;
    }
    .notification .close-btn:hover {
        color: var(--danger-red);
        transform: scale(1.1);
    }
    @keyframes slideInRight {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }
    @keyframes fadeOut {
        from { opacity: 1; transform: translateX(0); }
        to { opacity: 0; transform: translateX(100%); }
    }
    .notification.timed::after {
        content: '';
        position: absolute;
        left: 0;
        bottom: 0;
        height: 3px;
        width: 100%;
        background-color: rgba(255, 255, 255, 0.1);
    }
    .notification.timed .progress-bar {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 3px;
        background-color: currentColor; 
        animation: shrink-width var(--notification-duration) linear forwards;
        width: 100%;
    }
    @keyframes shrink-width {
        from { width: 100%; }
        to { width: 0%; }
    }

function showNotification(message, type = 'info', duration = 5000) {
    const container = document.getElementById('notificationContainer');
    const notification = document.createElement('div');
    notification.classList.add('notification', type);
    let iconClass = type === 'success' ? 'fa-check-circle' : (type === 'error' ? 'fa-times-circle' : 'fa-info-circle');
    notification.innerHTML = `
        <i class="fas ${iconClass} icon"></i>
        <span class="message">${message}</span>
        <button class="close-btn">&times;</button>
        ${duration > 0 ? `<div class="progress-bar"></div>` : ''}
    `;
    container.appendChild(notification);
    const closeNotification = () => {
        notification.style.animation = 'fadeOut 0.5s forwards';
        setTimeout(() => notification.remove(), 500);
    };
    notification.querySelector('.close-btn').addEventListener('click', closeNotification);
    if (duration > 0) {
        notification.style.setProperty('--notification-duration', `${duration / 1000}s`);
        setTimeout(closeNotification, duration);
    }
}

function toggleLoader(show, text = "Loading...") {
    loaderOverlay.classList.toggle('show', show);
    loadingText.textContent = text;
}

const fileToBase64 = file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = error => reject(error);
});

async function uploadToImgur(base64) {
    const res = await fetch("https://api.imgur.com/3/image", {
        method: "POST",
        headers: { Authorization: `Client-ID ${IMGUR_CLIENT_ID}` },
        body: new URLSearchParams({ image: base64, type: "base64" })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.data.error || 'Imgur upload failed.');
    return data.data.link;
}


function applyImageToPreview(url, previewEl, inputEl, linkEl) {
    if (url && url.length > 10) {       
        const finalUrl = url.startsWith('http') ? url : `https://${url}`;
               
        previewEl.style.backgroundImage = `url('${finalUrl}')`;
        previewEl.style.backgroundSize = "cover";
        previewEl.style.backgroundPosition = "center";
        previewEl.classList.add('has-image');
               
        const icon = previewEl.querySelector('.upload-icon, .central-icon');
        if (icon) icon.style.display = 'none';
              
        linkEl.value = finalUrl; 
               
        if (inputEl) inputEl.removeAttribute('required');
        return true;
    }
    return false;
}


function setupImageUpload(inputEl, previewEl, loadingEl, linkEl) {
    previewEl.onclick = () => inputEl.click();
    
    inputEl.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        try {
            loadingEl.style.display = 'flex';            
           
            const reader = new FileReader();
            reader.onload = (event) => {
                previewEl.style.backgroundImage = `url('${event.target.result}')`;
                previewEl.classList.add('has-image');
                const icon = previewEl.querySelector('.upload-icon, .central-icon');
                if (icon) icon.style.display = 'none';
            };
            reader.readAsDataURL(file);
            
            const base64Data = await fileToBase64(file);
            const uploadedUrl = await uploadToImgur(base64Data);
            
            linkEl.value = uploadedUrl; 
            showNotification("Image updated successfully!", "success", 2000);
            
        } catch (error) {
            showNotification("Upload failed: " + error.message, "error");
        } finally {
            loadingEl.style.display = 'none';
        }
    };
}


idVerificationForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const idCardNumber = document.getElementById('idCardNumber').value.trim();
    toggleLoader(true, 'Verifying Member ID...');

    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
            body: JSON.stringify({ idCardNumber })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Verification failed');
        
        memberData = data.member;
               document.getElementById('regIdCardNumber').value = memberData.idcardNumber || '';
        document.getElementById('regFullName').value = memberData.fullName || '';
        document.getElementById('regBusinessName').value = memberData.businessName || '';
        document.getElementById('regPhoneNumber').value = memberData.phoneNumber || '';
        document.getElementById('regEmail').value = memberData.email || '';
        document.getElementById('regShopNumber').value = memberData.bebejiShopNumber || '';
      
        const sImg = memberData.shopImageLink || memberData.shopImage || memberData.shopPhoto;
        const uImg = memberData.userImageLink || memberData.userImage || memberData.facePhoto;
       
        applyImageToPreview(sImg, shopImagePreview, shopImageInput, finalShopImageLink);
        applyImageToPreview(uImg, userImagePreview, userImageInput, finalUserImageLink);

        stage1.style.display = 'none';
        stage2.style.display = 'block';
        showNotification(`Welcome, ${memberData.fullName}!`, 'success');

    } catch (error) {
        showNotification(error.message, 'error');
    } finally {
        toggleLoader(false);
    }
});

registrationForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (password !== confirmPassword) {
        showNotification('Passwords do not match!', 'error');
        return;
    }

    if (!finalShopImageLink.value || !finalUserImageLink.value) {
        showNotification('Please upload both Shop and Profile photos.', 'error');
        return;
    }

    toggleLoader(true, 'Creating account...');

    try {
        const userCredential = await createUserWithEmailAndPassword(auth, memberData.email, password);
        const uid = userCredential.user.uid;

        const userData = {
            uid: uid,
            email: memberData.email,
            fullName: memberData.fullName,
            businessName: document.getElementById('regBusinessName').value,
            phoneNumber: memberData.phoneNumber,
            bebejiShopNumber: memberData.bebejiShopNumber || document.getElementById('regShopNumber').value,
            idcardNumber: memberData.idcardNumber,
            shopImageLink: finalShopImageLink.value,
            userImageLink: finalUserImageLink.value,
            registerTime: new Date().toLocaleString("en-NG", { timeZone: "Africa/Lagos" }),
            isProfilePublic: true
        };

        await set(ref(db, 'users/' + uid), userData);
        showNotification("Registration Successful!", "success");
        setTimeout(() => window.location.href = 'login.html', 2000);

    } catch (error) {
        showNotification(error.message, 'error');
    } finally {
        toggleLoader(false);
    }
});


document.addEventListener('DOMContentLoaded', () => {
    setupImageUpload(shopImageInput, shopImagePreview, document.getElementById('shopImageLoading'), finalShopImageLink);
    setupImageUpload(userImageInput, userImagePreview, document.getElementById('userImageLoading'), finalUserImageLink);
});
</script>
