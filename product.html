      :root {
    --primary-color: #00eaff;
    --secondary-color: #f7b32d;
    --dark-bg: #111;
    --mid-dark: #1a2b4d;
    --text-color: #f0f0f0;
    --glass-bg: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.2);   
    --accent-green: #00cc66;
    --danger-red: #e74c3c;
    --accent-blue: #4c72d6;
    --secondary-bg: #1e2a3c;
    --shadow-color: rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Arial', sans-serif; background-color: var(--dark-bg); color: var(--text-color); padding-top: 50px; transition: background-color 0.3s; }

.loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 999999; background: linear-gradient(135deg, #0e0f11, #112233, #1a2b4d, #144b7a); background-size: 400% 400%; animation: gradientMove 7s ease infinite; transition: opacity 0.5s; }
@keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
.loader-container { position: relative; width: 150px; height: 150px; display: flex; justify-content: center; align-items: center; }
.pulse { position: absolute; width: 140px; height: 140px; border-radius: 50%; border: 3px solid var(--primary-color); animation: pulseAnim 2.5s infinite ease-in-out; opacity: 0.5; }
@keyframes pulseAnim { 0% { transform: scale(0.6); opacity: 0.4; } 50% { transform: scale(1); opacity: 1; } 100% { transform: scale(0.6); opacity: 0.4; } }
.logo-wrapper { width: 80px; height: auto; border-radius: 10px; animation: floatLogo 3s infinite ease-in-out; box-shadow: 0 0 10px var(--primary-color); }
@keyframes floatLogo { 0% { transform: translateY(0); } 50% { transform: translateY(-12px); } 100% { transform: translateY(0); } }
.orbit { position: absolute; width: 160px; height: 160px; border-radius: 50%; border: 2px dashed var(--primary-color); animation: spin 5s linear infinite; opacity: 0.3; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.loading-text { position: absolute; bottom: -60px; width: 100%; text-align: center; font-size: 18px; color: var(--primary-color); letter-spacing: 2px; animation: fadeText 2s infinite; }
@keyframes fadeText { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }


#fixedHeader { position: fixed; top: 0; left: 0; width: 100%; height: 50px; background: rgba(17, 34, 51, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--primary-color); z-index: 1000; display: flex; align-items: center; }
.header-content { display: flex; align-items: center; width: 100%; padding: 0 10px; }
.shop-info { flex-grow: 1; text-align: center; overflow: hidden; white-space: nowrap; }
#shopTitle { 
    display: block; 
    font-size: 16px; 
    font-weight: bold; 
    color: var(--primary-color); 
    text-shadow: 0 0 5px rgba(0, 234, 255, 0.5);    
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis;
}
#backButton { background: none; border: none; color: var(--primary-color); font-size: 20px; cursor: pointer; margin-right: 10px; transition: transform 0.2s; }
#backButton:hover { transform: scale(1.1); }


#productsGallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 5px; padding: 5px; margin-bottom: 70px;
}
@media (min-width: 768px) { #productsGallery { grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px; } }
@media (max-width: 500px) { #productsGallery { grid-template-columns: repeat(2, 1fr); } }

.post-card {
    position: relative; overflow: hidden; height: 250px; background-color: #222; cursor: pointer;
    border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); transition: transform 0.2s, box-shadow 0.2s;
}
.post-image, .post-video { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.3s; }
.post-image.loading { background-color: #333; opacity: 0.5; }
.price-tag {

.post-card.selected { border: 3px solid var(--secondary-color); box-shadow: 0 0 15px var(--secondary-color); transform: scale(1.02); }
.post-actions-menu { position: absolute; top: 0px; left: 15px; z-index: 20; display: flex; gap: 15px; }
.action-button {
    background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(3px); color: white; border: none;
    padding: 6px; border-radius: 50%; cursor: pointer; font-size: 14px; transition: background 0.2s;
}
.action-button:hover { background: var(--primary-color); color: var(--dark-bg); }


#selectionFooter {
    position: fixed; bottom: 0; left: 0; width: 100%; min-height: 60px;

}
.selected-items-view { display: flex; overflow-x: auto; gap: 5px; padding: 5px; flex-grow: 1; max-width: 60%; }
.selected-item { position: relative; width: 50px; height: 50px; flex-shrink: 0; border-radius: 3px; overflow: hidden; border: 1px solid var(--secondary-color); }
.remove-selection { position: absolute; top: 0; right: 0; background: red; color: white; border: none; padding: 2px; font-size: 10px; line-height: 1; cursor: pointer; border-radius: 0 0 0 3px; }
.buy-actions { display: flex; align-items: center; padding: 0 10px; position: relative; }
.total-price-display { margin-right: 15px; font-size: 14px; white-space: nowrap; }
#totalPrice { display: block; font-size: 18px; font-weight: bold; color: var(--secondary-color); }
#buyButton {
    background: var(--primary-color); color: var(--dark-bg); border: none; padding: 10px 15px;
    border-radius: 25px; font-weight: bold; cursor: pointer; transition: background 0.2s, transform 0.2s;
    box-shadow: 0 0 15px rgba(0, 234, 255, 0.5); z-index: 10;
}
#buyOptionsContainer {
    position: absolute; bottom: 100%; right: 0; display: flex; flex-direction: column;
    background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(8px); border-radius: 10px; padding: 5px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.8); border: 1px solid var(--glass-border); transform: translateY(-5px); z-index: 10;
}
#buyOptionsContainer button {

}
#buyOptionsContainer button i { font-size: 20px; display: block; margin-bottom: 3px; color: var(--primary-color); }
#buyOptionsContainer button:hover { background-color: var(--mid-dark); }

#newPostFAB {
top: 400px;
    position: fixed; bottom: 80px; right: 20px; width: 50px; height: 50px;

#imageInputWrapper {

}
#imageUploadLabel {

#imagePreviewGrid {

}
@media (min-width: 768px) {

.image-preview-item {
    position: relative;

.input-group { margin-bottom: 15px; }

.input-group input, .input-group textarea {

}


#notificationContainer {
    position: fixed; top: 20px; right: 20px; z-index: 10000; display: flex;
    flex-direction: column; gap: 12px; max-width: 380px; pointer-events: none; 
}
.notification {
    position: relative; background-color: var(--secondary-bg); color: var(--text-color);
    padding: 15px 20px; border-radius: 10px; box-shadow: 0 4px 15px var(--shadow-color);
    display: flex; align-items: center; gap: 15px; opacity: 0;
    transform: translateX(100%); animation: slideInRight 0.5s forwards;
    pointer-events: all; transition: all 0.3s ease;
    border: 1px solid rgba(76, 114, 214, 0.3); overflow: hidden;
}
.notification.success { border-left: 5px solid var(--accent-green); box-shadow: 0 4px 15px rgba(0, 255, 153, 0.3); }
.notification.error { border-left: 5px solid var(--danger-red); box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3); }
.notification.info { border-left: 5px solid var(--accent-blue); box-shadow: 0 4px 15px rgba(76, 114, 214, 0.3); }
.notification .icon { font-size: 1.6em; min-width: 25px; }
.notification.success .icon { color: var(--accent-green); }
.notification.error .icon { color: var(--danger-red); }
.notification.info .icon { color: var(--accent-blue); }
.notification .message { flex-grow: 1; text-align: left; line-height: 1.4; font-size: 0.95em; }
.notification .close-btn {
    background: none; border: none; color: rgba(232, 232, 255, 0.7); font-size: 1.5em;
    cursor: pointer; line-height: 1; transition: color 0.3s ease; padding: 0;
}
.notification .close-btn:hover { color: var(--danger-red); transform: scale(1.1); }
@keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes fadeOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(100%); } }
.notification.timed::after { content: ''; position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background-color: rgba(255, 255, 255, 0.1); }
.notification.timed .progress-bar {
    position: absolute; left: 0; bottom: 0; height: 3px; background-color: currentColor;
    animation: shrink-width var(--notification-duration) linear forwards; width: 100%;
}
@keyframes shrink-width { from { width: 100%; } to { width: 0%; } }
@media (max-width: 600px) {
    #notificationContainer { top: 10px; bottom: auto; left: 10px; right: 10px; max-width: none; }
}

<script type="module">
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import { getDatabase, ref, get, query, limitToLast, orderByChild, endBefore, remove, push, update, set } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
import { app } from './firebase.js';

const auth = getAuth(app);
const db = getDatabase(app);


let currentShopOwnerUID = null;
let currentLoggedInUserUID = null;
let isShopOwner = false;
let shopData = {};
let posts = [];
let selectedPosts = new Map();
const POSTS_PER_LOAD = 12;
let lastPostTime = null;
let isLoadingPosts = false;
let currentCropper = null; 

const loaderOverlay = document.getElementById('loaderOverlay');
const loadingTextEl = document.getElementById('loadingText');
const productsGallery = document.getElementById('productsGallery');

function getShopOwnerUIDFromURL() {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('shopuid');
}

onAuthStateChanged(auth, async (user) => {
    currentShopOwnerUID = getShopOwnerUIDFromURL();

    if (user) {
        currentLoggedInUserUID = user.uid;
        if (!currentShopOwnerUID) {
            currentShopOwnerUID = user.uid;
        }
    } else {
        currentLoggedInUserUID = null;
    }

    if (!currentShopOwnerUID) {
        showNotification('Error: Shop ID (UID) not found in URL.', 'error');
        loadingTextEl.textContent = "Error: Shop ID not found. Cannot load products.";
        return;
    }

    isShopOwner = (currentLoggedInUserUID === currentShopOwnerUID);
    newPostFAB.style.display = isShopOwner ? 'block' : 'none';

    await initializeShop();
});

async function initializeShop() {
    try {
        await loadShopData(currentShopOwnerUID);
        setupEventListeners();
      
        if (deleteSelectedBtn) {
            deleteSelectedBtn.style.display = isShopOwner ? 'block' : 'none';
        }

        await loadPosts(POSTS_PER_LOAD, null, true);

    } catch (error) {
        console.error("Initialization Error:", error);
        showNotification(`Error loading shop data: ${error.message}`, 'error');
    } finally {
        hideLoader();
    }
}

async function loadShopData(uid) {
    loadingTextEl.textContent = "Loading Shop Details...";
    const snapshot = await get(ref(db, `users/${uid}`));

    if (!snapshot.exists()) {
        throw new Error("Shop Owner Data not found in /users/{uid}.");
    }
    shopData = snapshot.val();

    const businessName = shopData.businesName || 'N/A';
    const shopNumber = shopData.bebejiShopNumber || 'N/A';
    shopTitleEl.textContent = `Bebeji Plaza ${businessName} Shop No. ${shopNumber}`;
    document.title = `${businessName} Shop | Products`;
}


async function loadPosts(count, startTime, isInitialLoad = false) {  
    if (isLoadingPosts || !currentShopOwnerUID) return;
    isLoadingPosts = true;

    if (loadingMoreEl) loadingMoreEl.style.display = 'block';
   
    const isRefreshAfterPost = isInitialLoad && productsGallery && productsGallery.children.length > 0;

    if (isInitialLoad && !isRefreshAfterPost && productsGallery) {
        productsGallery.innerHTML = '';
    }

    const userPostsRef = ref(db, `users/${currentShopOwnerUID}/Posting`); 
    let postsQuery;   

    if (startTime) {
        postsQuery = query(
            userPostsRef,
            orderByChild('postTime'),
            limitToLast(count + 1),
            endBefore(startTime)
        );
    } else {
       
        postsQuery = query(
            userPostsRef,
            orderByChild('postTime'),
            limitToLast(isRefreshAfterPost ? 5 : count)
        );
    }

    try {
        const snapshot = await get(postsQuery);        
        if (!snapshot.exists() || snapshot.size === 0) {
            if (isInitialLoad && !isRefreshAfterPost && productsGallery) {
                productsGallery.innerHTML = `<p style="text-align: center; margin-top: 50px; color: var(--text-color);">No products available.</p>`;
            }
            if (loadingMoreEl) loadingMoreEl.style.display = 'none';
            lastPostTime = null;
            return;
        }

        let loadedPosts = [];
        snapshot.forEach(childSnapshot => {
             const post = { postId: childSnapshot.key, ...childSnapshot.val() };
             loadedPosts.push(post);
        });

       
        loadedPosts.sort((a, b) => b.postTime - a.postTime);        

        loadedPosts.forEach(post => {
            
            if (!posts.some(p => p.postId === post.postId)) {
                
                if (isRefreshAfterPost) {
                    posts.unshift(post); 
                    const postElement = createPostCard(post);
                    productsGallery.prepend(postElement); 
                } else {
                    posts.push(post); 
                    const postElement = createPostCard(post);
                    if (productsGallery) productsGallery.appendChild(postElement); 
                }
            }
        });

        
        if (!startTime && loadedPosts.lengt > 0) {
            lastPostTime = loadedPosts[loadedPosts.length - 1].postTime;
        }

        if (snapshot.size < count && !isRefreshAfterPost) {
             if (loadingMoreEl) loadingMoreEl.style.display = 'none';
             lastPostTime = null;
        }

        if (productsGallery) {
            document.querySelectorAll('.post-image.loading').forEach(img => imageObserver.observe(img));
        }

    } catch (error) {
        console.error("Firebase Load Error:", error);
        showNotification(`Error loading products: ${error.message}`, 'error');
    } finally {
        isLoadingPosts = false;
        if(productsGallery && productsGallery.innerHTML === '' && !isLoadingPosts) {
             productsGallery.innerHTML = `<p style="text-align: center; margin-top: 50px; color: var(--text-color);">No products available.</p>`;
        }
    }
}



const imageObserver = new IntersectionObserver((entries, observer) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            const mediaEl = entry.target;
            const postId = mediaEl.closest('.post-card').dataset.postId;
            const post = posts.find(p => p.postId === postId);
            
            const mediaLink = post.imageLink1 || post.giftVideoLink;
            if (mediaLink) {
                mediaEl.src = mediaLink;
                mediaEl.onload = () => {
                     mediaEl.classList.remove('loading');

                };
            }
            observer.unobserve(mediaEl);
        }
    });

}, { rootMargin: '0px 0px 300px 0px' });
window.addEventListener('scroll', () => {
    if (isLoadingPosts || !lastPostTime) return;
    if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
         loadPosts(POSTS_PER_LOAD, lastPostTime, false);
    }

});


function createPostCard(post) {
    const { postId, imageLink1, giftVideoLink, price } = post;
    const mediaLink = imageLink1 || giftVideoLink;
    if (!mediaLink) return document.createElement('div');
    const postCard = document.createElement('div');
    postCard.className = 'post-card';
    postCard.dataset.postId = postId;    
    const isVideo = mediaLink.endsWith('.mp4') || mediaLink.endsWith('.gif');
   
    const mediaEl = document.createElement(isVideo ? 'video' : 'img');
    mediaEl.className = isVideo ? 'post-video loading' : 'post-image loading';
    mediaEl.alt = `Product: ${postId}`;
    mediaEl.setAttribute('loading', 'lazy');
    if (isVideo) {
        mediaEl.setAttribute('autoplay', '');
        mediaEl.setAttribute('loop', '');
        mediaEl.setAttribute('muted', '');
        mediaEl.setAttribute('playsinline', '');
    }
    const priceTag = document.createElement('span');
    priceTag.className = 'price-tag';    
    const formattedPrice = new Intl.NumberFormat('ha-NG', {
        style: 'currency',
        currency: 'NGN',
        currencyDisplay: 'symbol'
    }).format(price || 0).replace('NGN', '₦');
    priceTag.innerHTML = formattedPrice;
    const actionMenuContainer = createPostActionMenu(post);
    postCard.appendChild(mediaEl);
    postCard.appendChild(priceTag);
    postCard.appendChild(actionMenuContainer);    
    imageObserver.observe(mediaEl);
    postCard.addEventListener('click', (e) => {
        
        if (!e.target.closest('.action-button') && !e.target.closest('.owner-dropdown')) {
            showFullViewModal(post);
        }
    });
    return postCard;
}
function createPostActionMenu(post) {
    const postId = post.postId;
    const menuContainer = document.createElement('div');
    menuContainer.className = 'post-actions-menu';      
    const selectBtn = document.createElement('button');
    selectBtn.className = 'action-button select-btn';
    selectBtn.innerHTML = '<i class="fas fa-check"></i>';
    selectBtn.title = 'Select Item';
    selectBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleSelection(postId);
    });

    menuContainer.appendChild(selectBtn);       

    if (isShopOwner) {
        const ownerMenuBtn = document.createElement('button');
        ownerMenuBtn.className = 'action-button owner-menu-btn';
        ownerMenuBtn.innerHTML = '<i class="fas fa-ellipsis-v"></i>';
        ownerMenuBtn.title = 'Owner Actions';
        ownerMenuBtn.addEventListener('click', (e) => {
             e.stopPropagation();
             showOwnerPostMenu(e.currentTarget, post);
        });
      
        menuContainer.appendChild(ownerMenuBtn); 
    }    
    return menuContainer;
}


function toggleSelection(postId) {
    const postCard = document.querySelector(`.post-card[data-post-id="${postId}"]`);
    const post = posts.find(p => p.postId === postId);
    if (!postCard || !post) return;
    if (selectedPosts.has(postId)) {
        selectedPosts.delete(postId);
        postCard.classList.remove('selected');
    } else {
        selectedPosts.set(postId, post);
        postCard.classList.add('selected');
    }
    updateSelectionUI();
}
function updateSelectionUI() {
    let total = 0;
    selectedItemsView.innerHTML = '';    
    if (selectedPosts.size === 0) {
        selectionFooter.style.display = 'none';
        buyOptionsContainer.style.display = 'none';
        return;
    }
    selectedPosts.forEach((post, postId) => {
        total += Number(post.price);        
        const itemEl = document.createElement('div');
        itemEl.className = 'selected-item';
        itemEl.dataset.postId = postId;
        const mediaLink = post.imageLink1 || post.giftVideoLink || '';       
        itemEl.innerHTML = `
            <img src="${mediaLink}" alt="Selected Item" style="width: 100%; height: 100%; object-fit: cover;"/>
            <button class="remove-selection" data-post-id="${postId}" title="Remove"><i class="fas fa-times"></i></button>
        `;
        selectedItemsView.appendChild(itemEl);
    });
    const formattedTotal = new Intl.NumberFormat('ha-NG').format(total);
    totalPriceEl.innerHTML = `₦${formattedTotal}`;
    selectionFooter.style.display = 'flex';
}



function handleBuyAction(action) {      
    if (selectedPosts.size === 0) {
        showNotification("Please select the products you wish to purchase first.", 'info');
        return;
    }
    
    const selectedItems = Array.from(selectedPosts.values());    
    const total = selectedItems.reduce((sum, item) => sum + Number(item.price), 0);
    const shopUID = typeof currentShopOwnerUID !== 'undefined' ? currentShopOwnerUID : null;

    if (!shopUID) {
         showNotification("Error: Shop ID (UID) is missing. Cannot proceed.", 'error');
         return;
    }

    const shopData = document.querySelector('[data-bebeji-shop-number]') ? 
                     document.querySelector('[data-bebeji-shop-number]').dataset : {};
    
    
    const productList = selectedItems.map((item, index) => {
        const price = Number(item.price).toLocaleString();
        return `*Item ${index + 1}* (₦${price}): ${item.text || 'Product Details'}`;
    }).join('\n');
        
    const shopNumber = shopData.bebejiShopNumber ? `No. ${shopData.bebejiShopNumber}` : '';
    const formattedTotal = total.toLocaleString();
    const baseMessage = `Hello, I'd like to purchase the following products from your Bebeji Plaza Shop ${shopNumber}:\n\n*Total Price:* ₦${formattedTotal}\n\n*Products Details:*\n${productList}\n\nPlease confirm availability.`;

    if (action === 'chat') {               
        const chatItems = selectedItems.map(item => {
            
            const itemImages = [item.imageLink1, item.imageLink2, item.imageLink3, item.giftVideoLink].filter(Boolean);
            
            return {
                 price: Number(item.price), 
                 text: item.text || "Product Details",
                 images: itemImages 
            };
        });
     
        const chatPayload = { 
            type: 'cart', 
            shopUID: shopUID,
            total: total, 
            
            firstItemMedia: chatItems[0].images[0] || null,
            items: chatItems 
        };
                
        const encodedPayload = encodeURIComponent(JSON.stringify(chatPayload));
        window.location.href = `chat.html?shopuid=${shopUID}&payload=${encodedPayload}`;
        return;

    } else if (action === 'whatsapp') {
        const whatsappNumber = shopData.phoneNumber; 
        if (!whatsappNumber) {
            showNotification('Shop owner WhatsApp number not available.', 'error');
            return;
        }
        const whatsappMessage = encodeURIComponent(baseMessage);
        window.open(`https://wa.me/${whatsappNumber}?text=${whatsappMessage}`, '_blank');
    }

    if (typeof buyOptionsContainer !== 'undefined') buyOptionsContainer.style.display = 'none';
}


function showFullViewModal(post) {
    modalOverlay.innerHTML = createFullViewHTML(post);

        modalOverlay.style.display = 'none';

function showOwnerPostMenu(button, post) {
    document.querySelectorAll('.owner-dropdown').forEach(d => d.remove());
  
    const dropdown = document.createElement('div');
    dropdown.className = 'owner-dropdown';
    dropdown.innerHTML = `
        <button id="editPostBtn"><i class="fas fa-edit"></i> Edit</button>
        <button id="deletePostBtn" style="color: var(--danger-red);"><i class="fas fa-trash-alt"></i> Delete</button>
        <button id="closeMenuBtn"><i class="fas fa-times"></i> Close</button>

    `;
    button.parentNode.appendChild(dropdown); 
       dropdown.querySelector('#closeMenuBtn').addEventListener('click', () => dropdown.remove());
    dropdown.querySelector('#editPostBtn').addEventListener('click', () => {
        dropdown.remove();
        showEditPostModal(post);
    });
    dropdown.querySelector('#deletePostBtn').addEventListener('click', () => {
        dropdown.remove();
        confirmDeletePost(post.postId);
    });
   
    function handleOutsideClick(e) {
        if (!dropdown.contains(e.target) && !button.contains(e.target)) {
            dropdown.remove();
            document.removeEventListener('click', handleOutsideClick);
        }
    }
    setTimeout(() => {
        document.addEventListener('click', handleOutsideClick);
    }, 10);
}


let currentPostIdToDelete = null;

function confirmDeletePost(postId) {
    currentPostIdToDelete = postId;
    
    const modal = document.getElementById('customConfirm');
    if (modal) {
        modal.style.display = 'flex';
       
        setTimeout(() => modal.classList.add('active'), 10);

       
        document.getElementById('cancelBtn').onclick = () => {
            modal.classList.remove('active');
            setTimeout(() => modal.style.display = 'none', 300);
        };

        
        document.getElementById('confirmBtn').onclick = () => {
            modal.classList.remove('active');
            setTimeout(() => modal.style.display = 'none', 300);
            executeDeletion(currentPostIdToDelete);
        };
    }
}

async function executeDeletion(postId) {
   
    const user = auth.currentUser;
    
    if (!user) {
        showNotification("Session expired. Please login again.", 'error');
        return;
    }

    loadingTextEl.textContent = "Deleting Post...";
    loaderOverlay.style.display = 'flex';
    loaderOverlay.style.opacity = '1';

    try {
      
        const postRef = ref(db, `users/${user.uid}/Posting/${postId}`);

        await remove(postRef);

       
        showNotification("Post Deleted Successfully!", 'success');
        
       
        if (typeof posts !== 'undefined') {
            posts = posts.filter(p => p.postId !== postId);
        }
        
       
        const postCard = document.getElementById(`post-${postId}`) || 
                         document.querySelector(`.post-card[data-post-id="${postId}"]`);
        
        if (postCard) {
            postCard.style.transition = '0.3s';
            postCard.style.opacity = '0';
            postCard.style.transform = 'scale(0.9)';
            setTimeout(() => postCard.remove(), 300);
        }
        
        hideLoader();
        if (typeof updateSelectionUI === "function") updateSelectionUI();

    } catch (error) {
        console.error("Firebase Delete Error:", error);
        showNotification(`Delete failed: ${error.message}`, 'error');
        hideLoader();
    }
}


async function confirmDeleteSelectedPosts() {
    if (selectedPosts.size === 0) {
        showNotification("Please select products to delete.", 'info');
        return;
    }
    
    if (!confirm(`Are you sure you want to delete all ${selectedPosts.size} selected products permanently? This action is irreversible.`)) {
        return;
    }
    
    showLoader("Deleting Selected Products...");
    const postsToDelete = Array.from(selectedPosts.keys());

    

    try {
        const updates = {};
        postsToDelete.forEach(postId => {
            updates[`/Posting/${postId}`] = null; 
        });

        
        await update(ref(db), updates);               
        postsToDelete.forEach(postId => {
            posts = posts.filter(p => p.postId !== postId);
            document.querySelector(`.post-card[data-post-id="${postId}"]`)?.remove();

        });
        
        selectedPosts.clear();
        updateSelectionUI();
        
        showNotification(`${postsToDelete.length} products deleted successfully!`, 'success');
    } catch (error) {
        console.error("Error deleting selected posts:", error);
        showNotification(`Error deleting products: ${error.message}`, 'error');
    } finally {
        hideLoader();
    }
}

function triggerAddMore() {
    if (currentMainImages.length >= 4) {
        showNotification("Error .", "info");
        return;
    }
    if (allStudioPosts.length === 0) {
        showNotification("Sellet other image .", "info");
        return;
    }
    isMergingMode = true; 
    if(studioFileInput) studioFileInput.click();
}


if (studioFileInput) {
    studioFileInput.onchange = (e) => {
        const files = Array.from(e.target.files);
        if (files.length > 0) {
            studioQueue = files;
            processStudioQueue(0);
        }
    };
}



function processStudioQueue(index) {
    if (index >= studioQueue.length) {
        if(editorOverlay) editorOverlay.style.display = 'none';
        renderStudioMainView();
        return;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
        if(editorOverlay) editorOverlay.style.display = 'flex';
        cropImgElement.src = e.target.result;
        
        if (studioCropper) studioCropper.destroy();
        studioCropper = new Cropper(cropImgElement, {
            aspectRatio: 1,
            viewMode: 1,
            autoCropArea: 1,
            background: false
        });

        document.getElementById('cutAction').onclick = () => {
            const canvas = studioCropper.getCroppedCanvas({ width: 800, height: 800 });
            const imgData = canvas.toDataURL('image/jpeg', 0.9);

            if (isMergingMode) {
                
                currentMainImages.push(imgData);
            } else {
               
                currentMainImages = [imgData];
                allStudioPosts.push({ id: Date.now(), images: currentMainImages });
            }
            
            isMergingMode = false; 
            updateStudioTopBar();
            processStudioQueue(index + 1);
        };
    };
    reader.readAsDataURL(studioQueue[index]);
}


function updateStudioTopBar() {
    if (allStudioPosts.length > 0) {
        studioTopBar.style.display = 'flex';
        studioTopBar.innerHTML = '';
        allStudioPosts.forEach((post) => {
            const img = document.createElement('img');
            img.src = post.images[0]; 
            img.className = 'post-thumb' + (post.images === currentMainImages ? ' active' : '');
            
           
            img.onclick = () => {
                currentMainImages = post.images;
                updateStudioTopBar();
                renderStudioMainView();
            };
            studioTopBar.appendChild(img);
        });
    }
}

function renderStudioMainView() {
    const welcomeUI = document.getElementById('welcome-ui');
    if(welcomeUI) welcomeUI.style.display = 'none';
    if(mainCanvas) mainCanvas.style.display = 'block';
    if(studioConfirmBtn) studioConfirmBtn.style.display = 'flex';

    const ctx = mainCanvas.getContext('2d');
    mainCanvas.width = 1000;
    mainCanvas.height = 1000;
    
    let loaded = 0;
    const imgs = [];

    currentMainImages.forEach((src, idx) => {
        const img = new Image();
        img.src = src;
        img.onload = () => {
            loaded++;
            imgs[idx] = img;
            if (loaded === currentMainImages.length) {
                drawStudioCollage(ctx, imgs);
            }
        };
    });
}

function drawStudioCollage(ctx, imgs) {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, 1000, 1000);
    const count = imgs.length;
    if (count === 1) ctx.drawImage(imgs[0], 0, 0, 1000, 1000);
    else if (count === 2) {
        ctx.drawImage(imgs[0], 0, 0, 498, 1000);
        ctx.drawImage(imgs[1], 502, 0, 498, 1000);
    } else if (count === 3) {
        ctx.drawImage(imgs[0], 0, 0, 498, 498);
        ctx.drawImage(imgs[1], 502, 0, 498, 498);
        ctx.drawImage(imgs[2], 251, 502, 498, 498);
    } else if (count >= 4) {
        ctx.drawImage(imgs[0], 0, 0, 498, 498);
        ctx.drawImage(imgs[1], 502, 0, 498, 498);
        ctx.drawImage(imgs[2], 0, 502, 498, 498);
        ctx.drawImage(imgs[3], 502, 502, 498, 498);
    }
}


studioConfirmBtn.onclick = async () => {
    if (allStudioPosts.length === 0) return;
    
    showLoader("committed Things...");
    postData = [];

    for (const post of allStudioPosts) {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = 1000;
        tempCanvas.height = 1000;
        const tempCtx = tempCanvas.getContext('2d');
        
        const imgs = await Promise.all(post.images.map(src => {
            return new Promise(resolve => {
                const img = new Image();
                img.src = src;
                img.onload = () => resolve(img);
            });
        }));

        drawStudioCollage(tempCtx, imgs);
        const finalData = tempCanvas.toDataURL('image/jpeg', 0.9);
        const blob = await (await fetch(finalData)).blob();
        const file = new File([blob], `product_${Date.now()}.jpg`, { type: "image/jpeg" });

        postData.push({
            file: file,
            price: 0,
            text: '',
            link: finalData
        });
    }

    if(studioRoot) studioRoot.style.display = 'none';
    modalOverlay.innerHTML = createNewPostFormHTML(); 
    modalOverlay.style.display = 'flex';
    updateImagePreview();
    setupPostFormListeners(false);
    hideLoader();
};



function showEditPostModal(post) {   
    postData = [{
        file: null, 
        price: post.price,
        text: post.text || '',
        link: post.imageLink1 || post.giftVideoLink,
        postId: post.postId
    }];
    
    modalOverlay.innerHTML = createNewPostFormHTML(post);
    modalOverlay.style.display = 'flex';
    updateImagePreview();
    setupPostFormListeners(true);
}

function createNewPostFormHTML(post = null) {
    const isEdit = post !== null;
    const title = isEdit ? 'Edit Product' : 'Product Details';
    const submitText = isEdit ? 'Save Changes' : 'Post Product';    
    return `
        <div class="modal-content-wrapper" data-is-edit="${isEdit}">
            <button class="close-modal"><i class="fas fa-times"></i></button>
            <h3 style="color: var(--primary-color); padding: 10px;">${title}</h3>
            <form id="postForm" style="padding: 10px;">
                <div id="imagePreviewGrid"></div>
                <button type="submit" id="submitPost" style="margin-bottom: 50px;">
                    <i class="fas fa-upload"></i> ${submitText}
                </button>
            </form>
        </div>
    `;
}

function setupPostFormListeners(isEdit) {
    const form = modalOverlay.querySelector('#postForm');
    const closeBtn = modalOverlay.querySelector('.close-modal');
    closeBtn.onclick = () => { modalOverlay.style.display = 'none'; postData = []; };
    form.onsubmit = (e) => { e.preventDefault(); handlePostSubmission(isEdit); };
}

function updateImagePreview() {
    const container = modalOverlay.querySelector('#imagePreviewGrid');
    if (!container) return;
    container.innerHTML = '';   
    postData.forEach((data, index) => {
        const itemEl = document.createElement('div');
        itemEl.className = 'image-preview-item';        
        itemEl.innerHTML = `
            <div class="input-group">
                <label>Product Description</label>
                <textarea id="text-${index}" maxlength="150" class="product-text-input" data-index="${index}">${data.text}</textarea>
            </div>           
            <img src="${data.link}" class="image-preview-media">
            <div class="input-group">
                <label>Price (₦)</label>
                <input type="number" id="price-${index}" class="product-price-input" data-index="${index}" value="${data.price || ''}" required>
            </div>
        `;        
        container.appendChild(itemEl);
    });

    container.querySelectorAll('.product-text-input').forEach(input => {
        input.oninput = (e) => { postData[e.target.dataset.index].text = e.target.value; };
    });
    container.querySelectorAll('.product-price-input').forEach(input => {
        input.oninput = (e) => { postData[e.target.dataset.index].price = Number(e.target.value); };
    });
}



async function handlePostSubmission(isEdit) {
    if (postData.length === 0) return;
    const validData = postData.every(d => d.price && Number(d.price) > 0);

    if (!validData) { 
        showNotification("Please enter a valid price.", 'error'); 
        return; 
    }

    showLoader(isEdit ? "Saving..." : "Posting...");

    try {
        const shopDetails = {
            fullName: shopData.fullName || 'N/A',
            bebejiShopNumber: shopData.bebejiShopNumber || 'N/A',
            userImageLink: shopData.userImageLink || 'N/A',
            businessName: shopData.businessName || 'N/A',
        };

        if (isEdit) {
            const post = postData[0];
            const updates = { price: post.price, text: post.text };
            await update(ref(db, `users/${currentShopOwnerUID}/Posting/${post.postId}`), updates);
            
            const index = posts.findIndex(p => p.postId === post.postId);
            if (index !== -1) {
                posts[index].price = post.price;
                posts[index].text = post.text;
            }
            showNotification("Post Updated!", 'success');
        } else {
            for (let data of postData) {
                const reader = new FileReader();
                reader.readAsDataURL(data.file);
                await new Promise(res => reader.onload = () => res());
                const base64 = reader.result.split(',')[1];
                
                const link = await uploadToImgur(base64);
                
                if (!link) {
                    throw new Error("Failed to upload image. Please check your internet or try again.");
                }
              
                const newPostRef = push(ref(db, `users/${currentShopOwnerUID}/Posting`));
                const newPostData = {
                    price: data.price,
                    text: data.text,
                    imageLink1: link, 
                    postTime: Date.now(),
                    ownerUid: currentShopOwnerUID,
                    seeCount: 0,
                    likeCount: 0,
                    ...shopDetails
                };
                await set(newPostRef, newPostData);
            }
            showNotification("Posted Successfully!", 'success');
        }

        modalOverlay.style.display = 'none';
        hideLoader();

        if (typeof resetStudio === 'function') resetStudio();

    
        await loadPosts(POSTS_PER_LOAD, null, true);

    } catch (error) {
        console.error("Submission Error:", error);
        showNotification(error.message, 'error'); 
        hideLoader();
    }
}


async function uploadToImgur(base64) {
    try {
        const res = await fetch("https://api.imgur.com/3/image", {
            method: "POST",
            headers: { Authorization: "Client-ID 5acf7eff9c91660" },
            body: new URLSearchParams({ image: base64, type: "base64" })
        });
        const data = await res.json();
        if (data.success) {
            return data.data.link;
        }
        return null;
    } catch (error) {
        console.error("Imgur Upload Error:", error);
        return null;
    }
}

function setupEventListeners() {
    backButton.addEventListener('click', () => window.history.back());
    
    selectedItemsView.addEventListener('click', (e) => {
        const target = e.target.closest('.remove-selection');
        if (target) {
            toggleSelection(target.dataset.postId);
        }
    });

    buyButton.addEventListener('click', () => {
        buyOptionsContainer.style.display = buyOptionsContainer.style.display === 'flex' ? 'none' : 'flex';
    });

    document.getElementById('chatNow').addEventListener('click', () => handleBuyAction('chat'));
    document.getElementById('whatsAppChat').addEventListener('click', () => handleBuyAction('whatsapp'));

    if (isShopOwner) {
        newPostFAB.addEventListener('click', showNewPostModal);
       
        deleteSelectedBtn.addEventListener('click', confirmDeleteSelectedPosts);
    }
    
    modalOverlay.addEventListener('click', (e) => {
       
        if (e.target === modalOverlay && !e.target.closest('#newPostModalContent')) {
             modalOverlay.style.display = 'none';
             modalOverlay.innerHTML = '';
             postData = [];
             selectedFiles = [];
        }
    });
}

function showLoader(message = "Loading...") {
    loadingTextEl.textContent = message;
    loaderOverlay.style.display = 'flex';
    loaderOverlay.style.opacity = '1';
}

function hideLoader() {
    loaderOverlay.style.opacity = '0';
    setTimeout(() => {
        loaderOverlay.style.display = 'none';
    }, 500);
}

function showNotification(message, type, duration = 4000) {
    const notification = document.createElement('div');
    notification.className = `notification ${type} timed`;
    notification.style.setProperty('--notification-duration', `${duration}ms`);

    let iconClass;
    if (type === 'success') iconClass = 'fas fa-check-circle';
    else if (type === 'error') iconClass = 'fas fa-times-circle';
    else iconClass = 'fas fa-info-circle';

    notification.innerHTML = `
        <div class="icon"><i class="${iconClass}"></i></div>
        <div class="message">${message}</div>
        <button class="close-btn"><i class="fas fa-times"></i></button>
        <div class="progress-bar" style="background-color: ${type === 'success' ? 'var(--accent-green)' : type === 'error' ? 'var(--danger-red)' : 'var(--accent-blue)'};"></div>
    `;
    notificationContainer.prepend(notification);    
    notification.querySelector('.close-btn').addEventListener('click', () => {
        hideNotification(notification);
    });

    setTimeout(() => {
        hideNotification(notification);
    }, duration);
}

function hideNotification(notification) {
    notification.style.animation = 'fadeOut 0.5s forwards';
    setTimeout(() => {
        notification.remove();
    }, 500);
}


function setupStudioListeners() {
    const btnGallery = document.getElementById('btnGallery');
    const btnMerge = document.getElementById('btnMerge');

    if (btnGallery) {
        btnGallery.addEventListener('click', () => {
            isMergingMode = false; 
            document.getElementById('studioFileInput').click();
        });
    }

    if (btnMerge) {
        btnMerge.addEventListener('click', () => {
            // Check if there are posts in the gallery
            if (allStudioPosts.length === 0) {
                showNotification("Please select an image from the Gallery before merging.", 'error');
                return;
            }

            // Check if the collage limit is reached
            if (currentMainImages.length >= 4) {
                showNotification("You have reached the limit of 4 images for this collage!", 'warning');
                return;
            }

            isMergingMode = true; 
            document.getElementById('studioFileInput').click();
        });
    }
}

document.addEventListener('DOMContentLoaded', setupStudioListeners);



window.closeStudio = function() {
    const studioRoot = document.getElementById('studio-root');
    if (studioRoot) {
        studioRoot.style.display = 'none';
      
        if (typeof resetStudio === 'function') resetStudio();
    }
};

window.resetStudio = function() {
    allStudioPosts = [];
    currentMainImages = [];
    isMergingMode = false;
    
    const topBar = document.getElementById('top-posts-bar');
    const canvas = document.getElementById('finalCanvas');
    const confirmBtn = document.getElementById('post-confirm-btn');
    const welcome = document.getElementById('welcome-ui');

    if (topBar) { topBar.innerHTML = ''; topBar.style.display = 'none'; }
    if (canvas) canvas.style.display = 'none';
    if (confirmBtn) confirmBtn.style.display = 'none';
    if (welcome) welcome.style.display = 'block';
};


let networkTimeout = setTimeout(() => {
    const loadingText = document.getElementById('loadingTextEl') || document.querySelector('.loading-text');
    const loaderOverlay = document.getElementById('loaderOverlay');

    if (loaderOverlay && loaderOverlay.style.display !== 'none') {
        showNotification("Poor network connection. Checking internet...", 'error');
        if (loadingText) {
            loadingText.innerHTML = '<b style="color:red;">Network Error: Processing...</b>';
        }
    }
}, 15000); 


const originalHideLoader = hideLoader;
hideLoader = function() {
    clearTimeout(networkTimeout);
    if (typeof originalHideLoader === 'function') originalHideLoader();
};
