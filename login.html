<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEBEJI PLAZA - Member Login</title> 

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
           
        :root {
            --primary-bg: #1A1A2E;
            --secondary-bg: #2B2B47;
            --text-primary: #E8E8FF;
            --accent-green: #00FF99;
            --accent-blue: #4C72D6;
            --danger-red: #E74C3C;
            --shadow-color: rgba(0, 0, 0, 0.5);
            --input-border-color: rgba(76, 114, 214, 0.5);
        }
               

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background-color: var(--primary-bg);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 0;
    line-height: 1.6;
    font-size: 16px;  
    text-shadow: 3px 4px 4px rgba(0, 0, 0, 0.3);   
    background-color: var(--primary-bg);        
    background-image: 
        linear-gradient(45deg, var(--secondary-bg) 25%, transparent 25%), 
        linear-gradient(-45deg, var(--secondary-bg) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--secondary-bg) 75%),
        linear-gradient(-45deg, transparent 75%, var(--secondary-bg) 75%);        
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;

  
    background-image:      
        linear-gradient(rgba(26, 26, 46, 0.7), rgba(26, 26, 46, 0.7)),       
        linear-gradient(45deg, var(--secondary-bg) 25%, transparent 25%), 
        linear-gradient(-45deg, var(--secondary-bg) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--secondary-bg) 75%),
        linear-gradient(-45deg, transparent 75%, var(--secondary-bg) 75%);
 
    background-size: 100% 100%, 20px 20px, 20px 20px, 20px 20px, 20px 20px;
    background-position: 0 0, 0 0, 0 10px, 10px -10px, -10px 0px;  
    background-attachment: scroll;  
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    margin: 0;
    overflow-y: auto;
    overflow-x: hidden;
}
        
                                 
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
       
        .card-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            position: relative;          
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
            border: 1px solid var(--input-border-color);
            overflow: hidden;
            width: 100%;
           z-index: 2;  
        }
       
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-color: var(--secondary-bg);           
            background: conic-gradient(
             transparent, 
                rgba(255, 0, 170, 0.6) 45%, 
                transparent 50%,
                transparent 95%
            );
            z-index: 0;
            animation: rotate-shine 15s linear infinite;                 
            box-shadow: 0 4px 12px var(--shadow-color);
            border: 1px solid rgba(76, 114, 214, 0.3);                           
        }
        .card::after {
            content: '';
            position: absolute;
            top: 1px;
            left: 1px;
            right: 1px;
            bottom: 1px;
            border-radius: 14px;
            z-index: 0; 
        }
        @keyframes rotate-shine {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
       
        .content-wrapper {
            position: relative;
            z-index: 3;
            width: 100%;
        }
        
        .header-section {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-image {
            width: 100%;
            max-width: 450px;
            height: auto;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px var(--shadow-color);
            border: 2px solid var(--accent-blue);          
            padding: 5px;
            background: linear-gradient(45deg, var(--accent-blue), var(--accent-green));
        }
        .title {
            font-size: 2rem;
            color: var(--accent-green);
            text-shadow: 0 0 10px rgba(0, 255, 153, 0.5);
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 1rem;
            color: var(--text-primary);
            opacity: 0.8;
        }       
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }
        .input-group label {
            display: none; 
        }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 15px 15px 15px 45px; 
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--input-border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
        }
        input::placeholder {
            color: rgba(232, 232, 255, 0.5);
        }
        input:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 8px rgba(0, 255, 153, 0.5);
            background-color: rgba(255, 255, 255, 0.1);
        }
        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-blue);
            font-size: 1.1em;
            pointer-events: none;
        }
   
        .btn {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s, box-shadow 0.3s;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        .btn-primary {
            background-color: var(--accent-green);
            color: var(--primary-bg);
        }
        .btn-primary:hover {
            background-color: #00e68a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 153, 0.5);
        }
        
        .footer-links {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        .link-item a {
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 0.9em;
            transition: color 0.3s;
        }
        .link-item a:hover {
            color: var(--accent-green);
            text-decoration: underline;
        }
        .register-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
     
        .loader-container {
            position: relative;
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .pulse {
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid #00eaff;
            animation: pulseAnim 2.5s infinite ease-in-out;
            opacity: 0.5;
        }
        @keyframes pulseAnim {
            0% { transform: scale(0.6); opacity: 0.4; }
            50% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.6); opacity: 0.4; }
        }
        .logo-wrapper {
            width: 80px;
            height: auto;
            border-radius: 10px;
            animation: floatLogo 3s infinite ease-in-out; 
            box-shadow: 0 0 10px rgba(0, 234, 255, 0.7);
        }
        @keyframes floatLogo {
            0% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0); }
        }
        .orbit {
            position: absolute;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 2px dashed #00eaff;
            animation: spin 5s linear infinite;
            opacity: 0.3;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .loading-text {
            position: absolute;
            bottom: -60px;
            width: 100%;
            text-align: center;
            font-size: 18px;
            color: #00eaff;
            letter-spacing: 2px;
            animation: fadeText 2s infinite;
        }
        @keyframes fadeText {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0e0f11, #112233, #1a2b4d, #144b7a);
            background-size: 400% 400%;
            animation: gradientMove 7s ease infinite;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .loader-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        #notificationContainer {
            position: fixed;
            top: 20px; 
            right: 20px;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 380px;
            pointer-events: none; 
        }
        .notification {
            position: relative;
            background-color: var(--secondary-bg);
            color: var(--text-primary);
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px var(--shadow-color);
            display: flex;
            align-items: center;
            gap: 15px;
            opacity: 0;
            transform: translateX(100%);
            animation: slideInRight 0.5s forwards;
            pointer-events: all;
            transition: all 0.3s ease;
            border: 1px solid rgba(76, 114, 214, 0.3);
            overflow: hidden;
        }
        .notification.success {
            border-left: 5px solid var(--accent-green);
            box-shadow: 0 4px 15px rgba(0, 255, 153, 0.3);
        }
        .notification.error {
            border-left: 5px solid var(--danger-red);
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
        }
        .notification.info {
            border-left: 5px solid var(--accent-blue);
            box-shadow: 0 4px 15px rgba(76, 114, 214, 0.3);
        }
        .notification .icon {
            font-size: 1.6em;
            min-width: 25px; 
        }
        .notification.success .icon {
            color: var(--accent-green);
        }
        .notification.error .icon {
            color: var(--danger-red);
        }
        .notification.info .icon {
            color: var(--accent-blue);
        }
        .notification .message {
            flex-grow: 1;
            text-align: left;
            line-height: 1.4;
            font-size: 0.95em;
        }
        .notification .close-btn {
            background: none;
            border: none;
            color: rgba(232, 232, 255, 0.7);
            font-size: 1.5em;
            cursor: pointer;
            line-height: 1;
            transition: color 0.3s ease;
            padding: 0;
        }
        .notification .close-btn:hover {
            color: var(--danger-red);
            transform: scale(1.1);
        }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(100%); }
        }
        .notification.timed::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            height: 3px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.1);
        }
        .notification.timed .progress-bar {
            position: absolute;
            left: 0;
            bottom: 0;
            height: 3px;
            background-color: currentColor; 
            animation: shrink-width var(--notification-duration) linear forwards;
            width: 100%;
        }
        @keyframes shrink-width {
            from { width: 100%; }
            to { width: 0%; }
        }
        /* Responsive adjustments */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .card-wrapper {
                max-width: 100%;
            }
            .card {
                padding: 25px 20px;
            }
            .title {
                font-size: 1.1rem;
            }
            #notificationContainer {
                top: 10px;  
                right: 10px;
                max-width: none;
            }
        }
    </style>

</head>

<body>
    <div id="loaderOverlay" class="loader-overlay">
        <div class="loader-container">
            <div class="orbit"></div>
            <div class="pulse"></div>
            <img class="logo-wrapper" src="https://i.imgur.com/MNooQYo.png" alt="BEBEJI Logo" />
            <div id="loadingText" class="loading-text">Authenticating...</div>
        </div>
    </div>

    <div id="notificationContainer"></div>
    
    <div class="card-wrapper">
        <div class="header-section">
            <img src="https://i.imgur.com/mmiXbDo.png" alt="BEBEJI PLAZA Entrance" class="logo-image">
            <h1 class="title">Member Access</h1>
            <p class="subtitle">Sign in to BEBEJI PLAZA Shop Services</p>
        </div>
        <div class="card">
            <div class="content-wrapper">
                <form id="loginForm">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" required placeholder="Enter your email address">
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" required placeholder="Enter your password">
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt"></i> SIGN IN
                    </button>
                </form>
                <div class="footer-links">
                    <div class="link-item">
                        <a href="forgot.html"><i class="fas fa-question-circle"></i> Forgot Password?</a>
                    </div>
                    <div class="link-item">
                        <a href="register.html"><i class="fas fa-user-plus"></i> Register New Member</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
   <script type="module">
import { app } from './firebase.js';

import { getAuth, signInWithEmailAndPassword, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import { setLogLevel } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

const loaderOverlay = document.getElementById('loaderOverlay');
const loadingText = document.getElementById('loadingText');

const auth = getAuth(app);
setLogLevel('debug');

function showNotification(message, type = 'info', duration = 5000) {
    const container = document.getElementById('notificationContainer');
    const notification = document.createElement('div');
    notification.classList.add('notification', type, 'timed');
    notification.style.setProperty('--notification-duration', `${duration}ms`);
    let iconClass = '';

    if (type === 'success') iconClass = 'fa-check-circle';
    else if (type === 'error') iconClass = 'fa-times-circle';
    else iconClass = 'fa-info-circle';

    notification.innerHTML = `
        <i class="fas ${iconClass} icon"></i>
        <span class="message">${message}</span>
        <button class="close-btn">&times;</button>
        <div class="progress-bar" style="background-color: var(--${type === 'success' ? 'accent-green' : type === 'error' ? 'danger-red' : 'accent-blue'})"></div>
    `;

    container.prepend(notification);

    const closeNotification = () => {
        notification.style.animation = 'fadeOut 0.5s forwards';
        setTimeout(() => notification.remove(), 500);
    };

    notification.querySelector('.close-btn').addEventListener('click', closeNotification);

    if (duration > 0) {
        setTimeout(closeNotification, duration);
    }
}

function toggleLoader(show, text = "Processing...") {
    loaderOverlay.classList.toggle('show', show);
    loadingText.textContent = text;
}

async function initialAuth() {
    try {
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        if (initialAuthToken) {
            await signInWithCustomToken(auth, initialAuthToken);
            console.log("Signed in with custom token.");
        }
    } catch (error) {
        console.error("Initial Authentication failed:", error);

        let errorMessage = 'Authentication failed. Please try logging in with your credentials.';
        
        switch (error.code) {
            case 'auth/custom-token-mismatch':
                errorMessage = 'The initial security token is invalid or expired. Please refresh the page.';
                break;
            case 'auth/admin-restricted-operation':
                errorMessage = 'Access denied. You may be trying to sign in as an admin from an unauthorized location.';
                break;
            default:
                break;
        }

        if (error.code !== 'auth/admin-restricted-operation') {
            showNotification(errorMessage, 'error', 10000);
        }
    }
}


document.addEventListener('DOMContentLoaded', () => {
    const loginForm = document.getElementById('loginForm');

    toggleLoader(false);

    initialAuth();

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
            showNotification('Please enter both email and password.', 'error', 4000);
            return;
        }

        toggleLoader(true, 'Signing In...');

        try {
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            console.log("Login successful:", userCredential.user.uid);

            showNotification('Login Successful! Redirecting to shop...', 'success', 3000);

            setTimeout(() => {
                window.location.href = 'shop.html';
            }, 1500);

        } catch (error) {
            toggleLoader(false);

            let errorMessage = 'An unexpected error occurred during login. Please try again.';

            switch (error.code) {
                case 'auth/user-not-found':
                case 'auth/wrong-password':
                case 'auth/invalid-credential':
                    errorMessage = 'Invalid email or password. Please try again.';
                    break;
                case 'auth/invalid-email':
                    errorMessage = 'The email address format is invalid.';
                    break;
                case 'auth/too-many-requests':
                    errorMessage = 'Access temporarily blocked due to too many failed attempts. Try again later.';
                    break;
                case 'auth/user-disabled':
                    errorMessage = 'Your account has been disabled.';
                    break;
                default:
                    errorMessage = 'Login failed. Please check your credentials and connection.';
                    break;
            }

            showNotification(errorMessage, 'error', 8000);
            console.error("Login Error:", error);
        }
    });
});
</script>
</body>
</html>
