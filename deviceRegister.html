<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Device Registration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
       
        :root {
            --primary-bg: #1A1A2E;
            --secondary-bg: #2B2B47;
            --text-primary: #E8E8FF;
            --accent-green: #00FF99;
            --accent-blue: #4C72D6;
            --danger-red: #E74C3C;
            --shadow-color: rgba(0, 0, 0, 0.5);
            --card-border-color: rgba(76, 114, 214, 0.3);
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            margin: 0;
            overflow-y: auto;
            overflow-x: hidden;
            background-image: 
                linear-gradient(rgba(26, 26, 46, 0.7), rgba(26, 26, 46, 0.7)),        
                linear-gradient(45deg, var(--secondary-bg) 25%, transparent 25%), 
                linear-gradient(-45deg, var(--secondary-bg) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, var(--secondary-bg) 75%),
                linear-gradient(-45deg, transparent 75%, var(--secondary-bg) 75%);            
            background-size: 100% 100%, 20px 20px, 20px 20px, 20px 20px, 20px 20px;
            background-position: 0 0, 0 0, 0 10px, 10px -10px, -10px 0px;       
            background-attachment: fixed;
        }

       
        .header {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        .header-title {
            font-size: clamp(20px, 4vw, 36px);
            font-weight: 800;
            color: var(--accent-green);
            text-align: center;
            flex-grow: 1;
        }

        .lang-switch {
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            background: none;
            border: 2px solid var(--accent-blue);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .lang-btn.active {
            background-color: var(--accent-blue);
        }

       
        .main-content {
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .card {
            position: relative;
            z-index: 1; 
            background: var(--secondary-bg);
            box-shadow: 0 4px 12px var(--shadow-color);
            border: 1px solid var(--card-border-color);
            border-radius: 15px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--accent-green);
        }

        input, select {
            width: 100%; 
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--accent-green);
            background-color: var(--primary-bg);
            color: var(--text-primary);
            box-sizing: border-box;
        }

        .input-with-icon {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: var(--accent-blue);
            border: none;
            color: white;
            padding: 0 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent-blue);
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
        }

        
        .scanner-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000; display: none; flex-direction: column;
        }

        #webcam { width: 100%; height: 70%; object-fit: cover; }

        .scanner-ui-bottom {
            height: 30%;
            background: var(--primary-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

       

        .certificate-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-top: 30px;
        }

        .certificate-container.active { display: flex; }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
        }

        .action-btn {
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        #uploadImageBtn { background: var(--accent-green); }
        #uploadPdfBtn { background: var(--danger-red); color: white; }
        #printBtn { background: var(--accent-blue); color: white; }
        
        @media print {
            .header, .action-buttons, #deviceForm, .loader-overlay { display: none !important; }
            body { background: white; }
            .certificate-container.active { display: block; }
        }
        
               
                           
      
        #notificationContainer { position: fixed; top: 20px; right: 20px; z-index: 9999999 !important; display: flex; flex-direction: column; gap: 12px; max-width: 380px; pointer-events: none; }
        .notification { position: relative; background-color: var(--secondary-bg); color: var(--text-primary); padding: 15px 20px; border-radius: 10px; box-shadow: 0 4px 15px var(--shadow-color); display: flex; align-items: center; gap: 15px; opacity: 0; transform: translateX(100%); animation: slideInRight 0.5s forwards; pointer-events: all; transition: all 0.3s ease; border: 1px solid var(--card-border-color); overflow: hidden; }
        .notification.success { border-left: 5px solid var(--accent-green); box-shadow: 0 4px 15px rgba(0, 255, 153, 0.3); }
        .notification.error { border-left: 5px solid var(--danger-red); box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3); }
        .notification.info { border-left: 5px solid var(--accent-blue); box-shadow: 0 4px 15px rgba(76, 114, 214, 0.3); }
        .notification .icon { font-size: 1.6em; min-width: 25px; }
        .notification.success .icon { color: var(--accent-green); }
        .notification.error .icon { color: var(--danger-red); }
        .notification.info .icon { color: var(--accent-blue); }
        .notification .message { flex-grow: 1; text-align: left; line-height: 1.4; font-size: 0.95em; }
        .notification .close-btn { background: none; border: none; color: rgba(232, 232, 255, 0.7); font-size: 1.5em; cursor: pointer; line-height: 1; transition: color 0.3s ease; padding: 0; }
        .notification .close-btn:hover { color: var(--danger-red); transform: scale(1.1); }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(100%); } }
        @media (max-width: 600px) { #notificationContainer { top: 10px; bottom: auto; left: 10px; right: 10px; max-width: none; } }

      
        @media (max-width: 850px) {
            .certificate-container { margin-top: 30px; }
            .header { flex-direction: column; gap: 10px; }
            .lang-switch { margin-top: 10px; }
            .action-buttons { flex-direction: column; }
            .action-btn { min-width: 100%; }
        }
        
        
       
@media print {  
    .header,
    .action-buttons,
    #deviceForm,
    #emailRetrySection,
    #notificationContainer,
    .loader-overlay {
        display: none !important;
    }
    
   
    .certificate-container.active {
        display: block !important;
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    #certificateTitle {
        display: none; 
    }

    #svgCertificateWrapper {
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
    }

   
    #certificateSVG {
        width: 290mm !important; 
        height: auto !important; 
        margin: 10mm auto !important; 
        box-shadow: none !important;
        border: none !important;
        display: block;
    }
    
    @page { 
        size: A4; 
        margin: 0;
    }
}



.scanner-modal {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #000; z-index: 10000; display: none; flex-direction: column;
}

.scanner-mask {
    position: absolute; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center;
}

.scanner-cutout {
    position: relative; width: 85%; height: 180px;
    border-radius: 15px; overflow: hidden; border: 2px solid rgba(255,255,255,0.2);
}

#webcam { 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
    background: #000;
}


.line-tech {
    position: absolute; top: 0; left: 0; width: 100%; height: 3px;
    background: #007bff; box-shadow: 0 0 15px #007bff;
    animation: scanMove 2s infinite ease-in-out;
}

@keyframes scanMove { 0%, 100% { top: 0; } 50% { top: 100%; } }


.selection-box {
    background: rgba(255,255,255,0.95); padding: 15px;
    border-radius: 15px; width: 90%; margin-bottom: 20px; text-align: center;
}

.code-buttons-wrapper { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 10px; }

.code-btn {
    background: #007bff; color: white; border: none; padding: 8px 15px;
    border-radius: 5px; font-weight: bold; cursor: pointer;
}

.imei-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 15px;
}
.imei-row {
    display: flex;
    gap: 8px;
    align-items: center;
}
.imei-row input {
    flex: 1;
}
.scan-btn {
    background: #003366;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 5px;
    cursor: pointer;
}
.retry-container {
    display: none;
    margin: 15px 0;
    padding: 10px;
    background: #fff3f3;
    border-left: 5px solid #cc0000;
    text-align: center;
}
#retryEmailBtn {
    background: #cc0000;
    color: white;
    padding: 8px 15px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
}


  .loader-container {
            position: relative;
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .pulse {
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid #00eaff;
            animation: pulseAnim 2.5s infinite ease-in-out;
            opacity: 0.5;
        }
        @keyframes pulseAnim {
            0% { transform: scale(0.6); opacity: 0.4; }
            50% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.6); opacity: 0.4; }
        }
        .logo-wrapper {
            width: 80px;
            height: auto;
            border-radius: 10px;
            animation: floatLogo 3s infinite ease-in-out; 
            box-shadow: 0 0 10px rgba(0, 234, 255, 0.7);
        }
        @keyframes floatLogo {
            0% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0); }
        }
        .orbit {
            position: absolute;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 2px dashed #00eaff;
            animation: spin 5s linear infinite;
            opacity: 0.3;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .loading-text {
            position: absolute;
            bottom: -60px;
            width: 100%;
            text-align: center;
            font-size: 18px;
            color: #00eaff;
            letter-spacing: 2px;
            animation: fadeText 2s infinite;
        }
        @keyframes fadeText {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
        
         .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0e0f11, #112233, #1a2b4d, #144b7a);
            background-size: 400% 400%;
            animation: gradientMove 7s ease infinite;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .loader-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
    
.loader-overlay.show {
    display: flex !important;
}

 .action-buttons {

}

 
  .tv-frame {
            width: 95%;
            max-width: 700px;
            height: 260px;
            margin: 30px auto;
            background: #1a1a1a; 
            border: 12px solid #333;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
     
        .tv-screen {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 5px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

      
        .stage {
            position: absolute;
            width: 90%;
            text-align: center;
            opacity: 0;
            animation: tvSlide 28s infinite;
        }

        
        .stage-1 { animation-delay: 0s; }
       
        .stage-2 { animation-delay: 7s; }
        
        .stage-3 { animation-delay: 14s; }
        
        .stage-4 { animation-delay: 21s; }

        @keyframes tvSlide {
            0%, 2% { opacity: 0; transform: scale(1.1); }
            5%, 23% { opacity: 1; transform: scale(1); }
            25%, 100% { opacity: 0; transform: scale(0.9); }
        }

        
        .tv-image {
            width: 100%;
            height: 100%;
            background-image: url('https://i.imgur.com/R6G3lGO.jpeg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        
        .tv-screen h2 {
            font-family: 'Trebuchet MS', sans-serif;
            color: #007bff;
            font-size: 1.6rem;
            margin-bottom: 15px;
        }

        .tv-screen p {
            font-family: Arial, sans-serif;
            font-size: 1.2rem;
            color: #444;
        }

        .dial-code {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #fdf2f2;
            border: 2px solid #d9534f;
            border-radius: 50px;
            color: #d9534f;
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

       
        .tv-indicator {
            position: absolute;
            bottom: 5px;
            width: 40px;
            height: 4px;
            background: #555;
            border-radius: 10px;
        }

}

}

.lang-btn:hover {
    background-color: #003366;
    color: white;
}

.lang-btn.active {
    background-color: #003366;
    color: white;
}

    </style>
</head>

    </div>
</div>
<div id="notificationContainer"></div>

<center>
    <h1 class="header-title" id="mainHeader">Device Register Card <span id="businessNameHeader">Loading...</span> Shop</h1>
    
    
    
<div class="tv-frame">
    <div class="tv-screen">
        
        <div class="stage stage-1">
            <h2>Duba IMEI/Serial Code</h2>

</main>
<div  class="lang-switch">
    <button class="lang-btn active" id="langEnglishBtn" data-lang="en"><i class="fas fa-globe"></i> English</button>
    <button class="lang-btn" id="langHausaBtn" data-lang="ha"><i class="fas fa-flag"></i> Hausa</button>
</div>





<main class="main-content">
    <form id="deviceForm" class="card">
        <h2 style="color: var(--accent-blue); text-align: center;" id="formTitle">Buyer Information</h2>
        
        <div class="form-group">
            <label for="fullNameInput" data-ha="Cikakken Suna" data-en="Full Name">Full Name</label>
            <input type="text" id="fullNameInput" required>
        </div>

        <div class="form-group">
            <label for="phoneNumberInput" data-ha="Lambar Wayar" data-en="Phone Number">Phone Number</label>
            <input type="tel" id="phoneNumberInput" required placeholder="080...">
        </div>

        <div class="form-group">
            <label for="genderSelect" data-ha="Jinsi" data-en="Gender">Gender</label>
            <select id="genderSelect" required>
                <option value="" disabled selected>Select Gender</option>
                <option value="Male" data-ha="Namiji" data-en="Male">Male</option>
                <option value="Female" data-ha="Mace" data-en="Female">Female</option>
            </select>
        </div>

        <div class="form-group">
            <label for="deviceNameInput" data-ha="Sunan Na'urar" data-en="Device Name">Device Name</label>
            <input type="text" id="deviceNameInput" required placeholder="e.g iPhone 13">
        </div>

        <div class="form-group">
            <label for="emailInput" data-ha="Email (Ba dole ba)" data-en="Email (Optional)">Email (Optional)</label>
            <input type="email" id="emailInput" placeholder="example@mail.com">
        </div>

        <div class="form-group">
            <label data-ha="Lambar IMEI (Zaka iya saka har guda 3)" data-en="IMEI Numbers (Up to 3)">IMEI Numbers</label>
            <div class="imei-inputs-wrapper">
                <div class="input-with-icon">
                    <input type="text" id="imei1" class="imei-field" placeholder="IMEI 1" required>
                    <button type="button" class="icon-btn scan-trigger" data-target="imei1"><i class="fas fa-qrcode"></i></button>
                </div>
                <div class="input-with-icon">
                    <input type="text" id="imei2" class="imei-field" placeholder="IMEI 2 (Optional)">
                    <button type="button" class="icon-btn scan-trigger" data-target="imei2"><i class="fas fa-qrcode"></i></button>
                </div>
                <div class="input-with-icon">
                    <input type="text" id="imei3" class="imei-field" placeholder="IMEI 3 (Optional)">
                    <button type="button" class="icon-btn scan-trigger" data-target="imei3"><i class="fas fa-qrcode"></i></button>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="priceInput" data-ha="Farashi (₦)" data-en="Price (₦)">Price (₦)</label>
            <input type="number" id="priceInput" required>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Submit</button>
    </form>

    <div class="certificate-container" id="certificateView" style="display:none;">
        <h2 style="color: #28a745; text-align: center;" id="certificateTitle">Generated Sales Certificate</h2>
        
        <div id="certificateSVG" style="width: 100%; max-width: 800px; margin: 0 auto; background: #eee;"></div>

            <p style="color: red;" data-en="Email failed to send." data-ha="An kasa tura Email."></p>
            <button id="retryEmailBtn" class="action-btn" style="background: red;">Retry Email</button>
        </div>

    <button class="action-btn" id="uploadImageBtn">Download Image</button>
    <button class="action-btn" id="uploadPdfBtn">Download PDF</button> <button class="action-btn" id="printBtn">Print</button>
    <button class="action-btn" id="newFormBtn">New Registration</button>

    </div>
</main>


<div id="scannerModal" class="scanner-modal" style="display:none;">

    function showNotification(type, messageKey, duration = 4000) {
        const container = document.getElementById('notificationContainer');

        const html = `<div class="notification ${type}"><div class="message">${msg}</div></div>`;

    async function startScanner() {
        const modal = document.getElementById('scannerModal');
        const video = document.getElementById('webcam');
        if(!modal || !video) return;
        modal.style.display = 'flex';
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            isScanning = true;
            processScannerFrame();
        } catch (e) {
            alert("Camera error!");
            modal.style.display = 'none';
        }
    }

    async function processScannerFrame() {
        if (!isScanning) return;
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('tempCanvas');
        if(!video || !canvas) return;
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0);
        try {
            const result = await Tesseract.recognize(canvas, 'eng');
            const matches = result.data.text.match(/\d{14,16}/g);
            if (matches && activeImeiTarget) {
                activeImeiTarget.value = matches[0];
                stopScanner();
                showNotification('success', 'IMEI Captured!');
            }
        } catch (e) {}
        if (isScanning) requestAnimationFrame(processScannerFrame);
    }

    function stopScanner() {
        isScanning = false;
        const video = document.getElementById('webcam');
        if (video && video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
        const modal = document.getElementById('scannerModal');
        if(modal) modal.style.display = 'none';
    }

    const closeScanner = document.getElementById('closeScannerBtn');
    if(closeScanner) closeScanner.onclick = stopScanner;

function showPushNotification(message, type = 'info') {
    const container = document.getElementById('notificationContainer');
    if (!container) return;

    const notif = document.createElement('div');
    notif.className = `notification ${type}`;
    const icon = type === 'success' ? 'fa-check-circle' : (type === 'error' ? 'fa-exclamation-triangle' : 'fa-info-circle');
    
    notif.innerHTML = `
        <i class="fas ${icon} icon"></i>
        <div class="message">${message}</div>
        <button class="close-btn">&times;</button>
    `;

    container.appendChild(notif);

  
    setTimeout(() => {
        notif.style.animation = 'fadeOut 0.5s forwards';
        setTimeout(() => notif.remove(), 500);
    }, 5000);

    notif.querySelector('.close-btn').onclick = () => notif.remove();
}

    async function sendCertificateEmail(data) {
        const sellerEmail = sellerData.email || auth.currentUser.email;
        const recipientEmails = [data.buyerEmail, sellerEmail].filter(e => e);
        if (recipientEmails.length === 0) return true;

        try {
            const svg = document.querySelector('#certificateSVG svg');
            const svgData = new XMLSerializer().serializeToString(svg);
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();

            const pngData = await new Promise((resolve, reject) => {
                img.onload = () => {
                    canvas.width = 800; canvas.height = 1000;
                    ctx.fillStyle = "white"; ctx.fillRect(0, 0, 800, 1000);
                    ctx.drawImage(img, 0, 0);
                    resolve(canvas.toDataURL('image/png'));
                };
                img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
            });

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
                body: JSON.stringify({ to: recipientEmails.join(','), imageData: pngData, data: data })
            });
            return response.ok;
        } catch (e) { return false; }
    }

  
    function translatePage(lang) {
        currentLang = lang;
        localStorage.setItem('appLang', lang);
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById(lang === 'en' ? 'langEnglishBtn' : 'langHausaBtn');
        if(activeBtn) activeBtn.classList.add('active');

        document.querySelectorAll('[data-en]').forEach(el => {
            el.textContent = el.getAttribute(`data-${lang}`);
        });

        const submitBtn = document.getElementById('submitBtn');
        if (submitBtn) submitBtn.textContent = dictionary[lang]['submitBtn'];
    }

 
    const attachClick = (id, fn) => {
        const el = document.getElementById(id);
        if(el) el.onclick = fn;
    };

    attachClick('langEnglishBtn', () => translatePage('en'));
    attachClick('langHausaBtn', () => translatePage('ha'));
    attachClick('newFormBtn', () => location.reload());
    attachClick('printBtn', () => window.print());
    
    attachClick('retryEmailBtn', async () => {
        const btn = document.getElementById('retryEmailBtn');
        btn.disabled = true;
        const success = await sendCertificateEmail(currentCertificateData);
        if(success) document.getElementById('emailRetrySection').style.display = 'none';
        else btn.disabled = false;
    });

    attachClick('uploadImageBtn', () => {
        const svg = document.querySelector('#certificateSVG svg');
        if(!svg) return;
        const svgData = new XMLSerializer().serializeToString(svg);
        const link = document.createElement('a');
        link.download = `Certificate-${currentCertificateData.postId}.svg`;
        link.href = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
        link.click();
    });
    }
</script>
