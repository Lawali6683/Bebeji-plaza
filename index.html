        #notificationContainer {
            position: fixed;

        .notification {
            position: relative;
            background-color: var(--secondary-bg);
            color: var(--text-primary);
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px var(--shadow-color);
            display: flex;
            align-items: center;
            gap: 15px;
            opacity: 0;
            transform: translateX(100%);
            animation: slideInRight 0.5s forwards;
            pointer-events: all;
            transition: all 0.3s ease;
            border: 1px solid rgba(76, 114, 214, 0.3);
            overflow: hidden;
        }
        
        .notification.success { border-left: 5px solid var(--accent-green); box-shadow: 0 4px 15px rgba(0, 255, 153, 0.3); }
        .notification.error { border-left: 5px solid var(--danger-red); box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3); }
        .notification.info { border-left: 5px solid var(--accent-blue); box-shadow: 0 4px 15px rgba(76, 114, 214, 0.3); }
        .notification .icon { font-size: 1.6em; min-width: 25px; }
        .notification.success .icon { color: var(--accent-green); }
        .notification.error .icon { color: var(--danger-red); }
        .notification.info .icon { color: var(--accent-blue); }
        .notification .message { flex-grow: 1; text-align: left; line-height: 1.4; font-size: 0.95em; }
        .notification .close-btn { background: none; border: none; color: rgba(232, 232, 255, 0.7); font-size: 1.5em; cursor: pointer; line-height: 1; transition: color 0.3s ease; padding: 0; }
        .notification .close-btn:hover { color: var(--danger-red); transform: scale(1.1); }
        .notification.timed .progress-bar { position: absolute; left: 0; bottom: 0; height: 3px; background-color: currentColor; width: 100%; }

        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(100%); } }
        @keyframes shrink-width { from { width: 100%; } to { width: 0%; } }

        @media (max-width: 600px) {

       .fab-main {
            width: 57px;

        }
       
        .fab-main:hover {
            background-color: #555;
            transform: rotate(180deg);
          
        }

      
        .fab-menu-container.open .fab-main {
            background-color: #dc3545; 
            transform: rotate(45deg); 
        }

      
        .fab-menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: row; 
            gap: 10px;           
            pointer-events: none; 
            
            
        }
        
        .fab-menu-container.open .fab-menu-list {
            pointer-events: auto;
        }
        
        .fab-menu-list li {
            opacity: 0;
            transform: translateX(-50px) scale(0.8); 
                        transition: opacity 0.3s ease, transform 0.3s ease;
            transition-delay: calc(var(--i) * 0.08s); 
        }

        
        .fab-menu-container.open .fab-menu-list li {
            opacity: 1;
            transform: translateX(0) scale(1);
            transition-delay: calc(var(--i) * 0.1s);
        }
        
        .fab-menu-container.closing .fab-menu-list li {
            opacity: 0;
            transform: translateX(-50px) scale(0.8);
            transition-delay: calc((var(--total) - var(--i)) * 0.05s); 
        }

.rm_container.open li:nth-child(1) {   
    transform: translate(0, calc(-1 * var(--distance))) scale(1); 
}

.rm_container.open li:nth-child(2) {    
    transform: translate(calc(-1 * var(--diagonalDistance)), calc(-1 * var(--diagonalDistance))) scale(1); 
}

.rm_container.open li:nth-child(3) {   
    transform: translate(calc(-1 * var(--distance)), 0) scale(1); 
}

.rm_container.open li:nth-child(4) {   
    transform: translate(calc(-1 * var(--diagonalDistance)), var(--diagonalDistance)) scale(1); 
}

.rm_container.open li:nth-child(5) {   
    transform: translate(0, var(--distance)) scale(1); 
}

function getCustomerUIDIndex() {
    let customerUID = localStorage.getItem('bebeji_customer_uid');
    if (!customerUID) {
        customerUID = `GUEST_${Date.now()}_${Math.random().toString(36).substring(2, 9)}`;
        localStorage.setItem('bebeji_customer_uid', customerUID);
    }
    return customerUID;
}


window.showNotification = (title, message, type = 'info', duration = 4000) => {
    const container = document.getElementById('notificationContainer');
    if (!container) { 
        return; 
    }
    
    const notification = document.createElement('div');
    notification.className = `notification ${type} timed`;
    notification.style.setProperty('--notification-duration', `${duration}ms`);
    
    const iconClass = type === 'success' ? 'fas fa-check-circle' : 
                      type === 'error' ? 'fas fa-times-circle' : 'fas fa-info-circle';
    notification.innerHTML = `
        <i class="icon ${iconClass}"></i>
        <div class="message"><strong>${title}</strong><br>${message}</div>
        <button class="close-btn" onclick="this.closest('.notification').remove()"><i class="fas fa-times"></i></button>
        <div class="progress-bar" style="background-color: var(--${type === 'success' ? 'accent-green' : type === 'error' ? 'danger-red' : 'accent-blue'});"></div>
    `;
    
    container.appendChild(notification);
    
    setTimeout(() => {
        notification.style.animation = 'fadeOut 0.5s forwards';
        setTimeout(() => notification.remove(), 500);
    }, duration);
};

function checkAndHandleShopLink(uid) {
    const url = new URL(window.location.href);
    const pathSegments = url.pathname.split('/').filter(s => s.length > 0);
    
    if (pathSegments.length >= 2 && pathSegments[0] === 'shop') {
        const shopIdentifier = pathSegments[1];
        const marketId = pathSegments.length >= 3 ? pathSegments[2] : '';
        
        window.location.replace(`shop.html?shopuid=${shopIdentifier}&marketid=${marketId}`);
        return true;
    }
    return false;
}

function listenForChatNotifications(userUID) {
    const notificationsRef = ref(db, `users/${userUID}/chatNotifications`);
    off(notificationsRef);    
  
    onValue(notificationsRef, (snapshot) => { 
        const notifications = [];
        snapshot.forEach((childSnapshot) => {
            notifications.push({ ...childSnapshot.val(), shopUID: childSnapshot.key });
        });

        const count = notifications.length;
        
        let lastMessageShopName = 'BEBEJI Shop'; 
      
        updateNotificationUI(count, true, lastMessageShopName);
    });
}


function getGuestUIDForNotification() {
    const uid = localStorage.getItem('bebeji_customer_uid'); 
    return uid && uid.startsWith('GUEST_') ? uid : null; 
}

function listenForGuestNotifications() {
    const guestUID = getGuestUIDForNotification();
    if (!guestUID) return; 
  
    const notificationsRef = ref(db, `guestNotifications/${guestUID}`);   
    off(notificationsRef);
    onValue(notificationsRef, (snapshot) => {      
        let totalUnreadChats = 0;       
        if (snapshot.exists()) {            
            snapshot.forEach((childSnap) => {
                 const data = childSnap.val();                                
                 if (data && data.timestamp) {
                     totalUnreadChats += 1;
                 }
            });
        }
        
        const count = totalUnreadChats > 0 ? 1 : 0;                
        updateNotificationUI(count, false, 'a Shop');
    });
}

window.showChairmanPushNotification = function (
    headerText,
    postData,
    storageKey,
    postId
) {
    if (!postData) return;

    const container = document.getElementById('pushNotificationContainer');
    const header = document.getElementById('pushNotifHeader');
    const content = document.getElementById('notifContentWrapper');
    const okBtn = document.getElementById('pushNotifOKBtn');

    if (!container || !header || !content || !okBtn) {
        console.error("Push notification DOM missing");
        return;
    }

    content.innerHTML = '';
    header.textContent = headerText;

    if (postData.text) {
        const div = document.createElement('div');
        div.className = 'notif-text';
        div.innerHTML = postData.text;
        content.appendChild(div);
    }

    const imgUrl = postData.imageLink1 || postData.imageLink;
    if (imgUrl) {
        const img = document.createElement('img');
        img.src = imgUrl;
        img.className = 'notif-media-preview';
        content.appendChild(img);
    }

    if (postData.videoLink) {
        let el;
        if (postData.videoLink.includes('youtube')) {
            const id = postData.videoLink.split('v=')[1]?.split('&')[0];
            el = document.createElement('iframe');
            el.src = `https://www.youtube.com/embed/${id}`;
            el.allowFullscreen = true;
        } else {
            el = document.createElement('video');
            el.src = postData.videoLink;
            el.controls = true;
        }
        el.className = 'notif-media-preview';
        content.appendChild(el);
    }

    if (postData.audioLink) {
        const audio = document.createElement('audio');
        audio.src = postData.audioLink;
        audio.controls = true;
        content.appendChild(audio);
    }

    container.classList.add('show');

    okBtn.replaceWith(okBtn.cloneNode(true));
    const newBtn = document.getElementById('pushNotifOKBtn');

    newBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        container.classList.remove('show');
        localStorage.setItem(storageKey, postId);
    });
};





async function loadFilteredShopStatus(container) {
    if (!container) return;
      
    if (allShopUIDs.length === 0) allShopUIDs = await getAllShopOwnerUIDs();
      
    let freshUsers = allShopUIDs.filter(uid => !globalSeenStatusUIDs.has(uid));
    let pool = freshUsers.length > 5 ? freshUsers : allShopUIDs;
    
    let rands = [...pool].sort(() => Math.random() - 0.5).slice(0, 10);
    
    let localSet = new Set();
    for (const uid of rands) {
        if (!localSet.has(uid)) {
            localSet.add(uid);          
            await renderShopStatusItem(uid, container);
        }
    }
}

let isStatusStripLoaded = false; 

async function loadShopStatus(container) {
    if (!container) return;
    
    container.innerHTML = ''; 
    
    if (allShopUIDs.length === 0) allShopUIDs = await getAllShopOwnerUIDs();
 
    let currentBatchUIDs = new Set(); 
    let rands = [...allShopUIDs].sort(() => Math.random() - 0.5);
    
    const limit = (container.id === 'shopStatusStrip') ? 10 : 15;
    let count = 0;

    for (const uid of rands) {
        if (count >= limit) break;
     
        if (currentBatchUIDs.has(uid)) continue;        
        
        currentBatchUIDs.add(uid);
        
        const success = await renderShopStatusItem(uid, container);
        if (success) {
            globalSeenStatusUIDs.add(uid); 
            count++;
        }
    }
}

    try {
        const userSnap = await get(ref(db, `users/${uid}`));
        if (!userSnap.exists()) return false;
        const userData = userSnap.val();

        const bName = userData.businesName || userData.businessName || "Bebeji Shop";
        const pImg = userData.userImageLink || userData.profileImageLink || 'placeholder.png';
        
        const postSnap = await get(query(ref(db, `users/${uid}/Posting`), limitToLast(1)));
        let postData = null;

        const imageToShow = postData?.imageLink1 || userData.shopImageLink || pImg;
        const priceHTML = postData?.price ? `<div class="viewer-price2">₦${postData.price}</div>` : '';

                        ${priceHTML}
                        <img src="${imageToShow}" class="book-product-img">

async function recordPostView(uid, postId) {
    if (!uid || !postId) return;
    const viewKey = `viewed_${uid}_${postId}`;
    
    if (sessionStorage.getItem(viewKey)) return; 
    
    const postRef = ref(db, `users/${uid}/Posting/${postId}`);
    try {
        const snap = await get(postRef);
        let currentCount = snap.exists() && snap.val().seeCount ? snap.val().seeCount : 0;
        await update(postRef, { seeCount: currentCount + 1 });
        
        sessionStorage.setItem(viewKey, 'true'); 
       
        const seeCountEl = document.querySelector(`#post-${postId} .see-count`);
        if (seeCountEl) seeCountEl.textContent = currentCount + 1;
    } catch (e) {
        
    }
}





async function getAllShopOwnerUIDs() {
    try {
        const usersRef = ref(db, 'users'); 
        const userSnap = await get(usersRef);
        if (!userSnap.exists()) return [];
        
        let ownerUIDs = [];
        userSnap.forEach(child => {
            const userData = child.val();           
            const nameToUse = userData.businesName || userData.businessName;
           
            if (nameToUse) { 
                 ownerUIDs.push(child.key);
            }
        });
        return ownerUIDs;
    } catch (error) {
        
        return [];
    }
}


async function loadProductPosts() {
    if (isLoadingPosts) return false;
    isLoadingPosts = true;

    try {
        if (allShopUIDs.length === 0) allShopUIDs = await getAllShopOwnerUIDs();
        
        let loadedInThisBatch = 0;
        const TARGET_PER_LOAD = 6; 
        let shuffledUIDs = [...allShopUIDs].sort(() => Math.random() - 0.5);

        for (const uid of shuffledUIDs) {
            if (loadedInThisBatch >= TARGET_PER_LOAD) break;

            const postsRef = ref(db, `users/${uid}/Posting`);
            const lastSeenKey = userNextPostPointer[uid];

            let postQuery;
            if (lastSeenKey) {
                postQuery = query(postsRef, orderByChild('postTime'), endBefore(lastSeenKey), limitToLast(1));
            } else {
                postQuery = query(postsRef, orderByChild('postTime'), limitToLast(1));
            }

            const postSnap = await get(postQuery);

            if (postSnap.exists()) {
                let post = null;
                postSnap.forEach(child => {
                    post = { ...child.val(), postId: child.key, shopUID: uid };
                });

                if (post && !seenPostIDs.has(post.postId)) {
                    await renderProductPost(post);
                    seenPostIDs.add(post.postId);
                    userNextPostPointer[uid] = post.postTime; 
                    
                    loadedInThisBatch++;
                    postsSinceLastAd++;

                   
                    if (postsSinceLastAd >= 6) {
                        await insertAdminAndStatus(); 
                        postsSinceLastAd = 0;
                    }
                }
            }
        }

      
        if (loadedInThisBatch === 0 && postsSinceLastAd > 0) {
            await insertAdminAndStatus();
            postsSinceLastAd = 0; 
        }

        return loadedInThisBatch > 0;
    } catch (error) {
        
        return false;
    } finally {
        isLoadingPosts = false;
        if (typeof animateVisiblePosts === 'function') animateVisiblePosts();
    }
}

async function checkAndRenderAdsPost() {
    const adsRef = ref(db, 'AdminPost');
    try {
        const adsQuery = query(adsRef, orderByChild('postTime'), limitToLast(20));
        const adSnap = await get(adsQuery);
        
        if (!adSnap.exists()) return false;

        let allAds = [];
        adSnap.forEach(child => {
            allAds.push({ ...child.val(), adId: child.key });
        });

        allAds.reverse();
        let adToDisplay = allAds.find(ad => !seenPostIDs.has(ad.adId));
        
        if (!adToDisplay) {
            adToDisplay = allAds[0]; 
        }

        if (adToDisplay) {
            renderAdsPost(adToDisplay, adToDisplay.adId);
            seenPostIDs.add(adToDisplay.adId);
            return true;
        }
        return false;
    } catch (e) { 
        console.error("Ads Error:", e);
        return false; 
    }
}


function renderAdsPost(post, adId) {
    const isVideo = post.videoLink && post.videoLink.includes('http');
    const isAudio = post.audioLink && post.audioLink.includes('http');
    let mediaHTML = '';
    
    if (isVideo) {
        mediaHTML = `
            <div class="ad-media-container">
                <video id="ad-media-${adId}" class="ad-media post-video" src="${post.videoLink}" loop muted playsinline data-media-type="video" onclick="viewMediaHandler(this.parentElement)"></video>
            </div>
        `;
    } else if (isAudio) {
        mediaHTML = `<audio id="ad-media-${adId}" src="${post.audioLink}" controls style="width:100%; margin-top:15px;"></audio>`;
    } else if (post.imageLink1) {
        mediaHTML = `
            <div class="ad-media-container">
                <img id="ad-media-${adId}" class="ad-media post-image" src="${post.imageLink1}" alt="Ad Image" loading="lazy" data-media-type="image" data-image2="${post.imageLink2 || ''}" onclick="viewMediaHandler(this.parentElement)">
            </div>
        `;
    }

    const textPreview = post.text ? post.text.split('\n')[0] : '';
    const fullText = post.text || '';
    
    const html = `
        <div class="ad-post-card" id="ad-post-${adId}" data-ad-id="${adId}">
            <div class="ad-header">⭐⭐⭐</div>

async function recordAdsView(adId) {
    if (!adId) return;
    const viewKey = `viewed_ad_${adId}`;
    if (sessionStorage.getItem(viewKey)) return; 

    const postRef = ref(db, `AdminPost/${adId}`);
    
    try {
        const snap = await get(postRef);
        if (snap.exists()) {
            const currentData = snap.val();
            const newCount = (currentData.seeCount || 0) + 1;
         
            await update(postRef, { seeCount: newCount });
            
            sessionStorage.setItem(viewKey, 'true'); 
            
            const countEl = document.getElementById(`count-val-${adId}`);
            if (countEl) countEl.innerText = newCount;
        }
    } catch (e) {
        
    }
}

window.handleBuyOptionClick = async (postId, action, event) => {

    event.preventDefault(); 
    
    const postWrapper = document.querySelector(`#post-${postId} .post-content-wrapper`);
    if (!postWrapper) return;
    
    const shopUID = postWrapper.dataset.shopUid;
    const phoneNumber = postWrapper.dataset.phoneNumber;
    const price = postWrapper.dataset.price;
    const text = postWrapper.dataset.text || 'Product Details';
  
    const mediaEl = document.getElementById(`media-${postId}`);
    let productLink = '';
    if (mediaEl) {
        if (mediaEl.tagName === 'VIDEO' || mediaEl.tagName === 'IMG') {
            productLink = mediaEl.src;
        }
    }
    
  
    
    let previewURL = '';
    let message = '';
    
    if (productLink) {
        const encodedImg = encodeURIComponent(productLink);
        const encodedText = encodeURIComponent(text);
        const encodedPrice = encodeURIComponent(price);
        const domain = 'https://bebejiplaza.pages.dev';
        previewURL = `${domain}/product_preview.html?img=${encodedImg}&text=${encodedText}&price=${encodedPrice}&shop=${shopUID}`;
        
        message = encodeURIComponent(`${previewURL}\n\nHello, I am interested in this item: "${text.substring(0, 50)}..." (Price: ${price}).\n`);
    } else {
         message = encodeURIComponent(`Hello, I am interested in this item: "${text.substring(0, 50)}..." (Price: ${price}).\n`);
    }
    
   
    
    if (action === 'chat') {      
        const chatPayload = {
            type: 'post', 
            postId: postId,
            productLink: productLink, 
            text: text,
            price: price,
            shopUID: shopUID 
        };
               
        const encodedPayload = encodeURIComponent(JSON.stringify(chatPayload));
      
        window.location.href = `chat.html?shopuid=${shopUID}&payload=${encodedPayload}`;
               
        return;
    }
    
    if (action === 'whatsapp') {
 
        if (phoneNumber && phoneNumber !== 'N/A') {
            window.open(`https://wa.me/${phoneNumber}?text=${message}`, '_blank');
        } else {
            showNotification('Error Network Try Again Nest time');
        }
    }
    
    document.getElementById(`buyOptions-${postId}`).classList.remove('show');
}


document.addEventListener('click', async (event) => {
    const likeAction = event.target.closest('.like-action');
    if (likeAction) {
        event.preventDefault();

       
        const userOrGuestUID = (typeof currentLoggedInUserUID !== 'undefined' && currentLoggedInUserUID) 
                               || (typeof getCustomerUIDIndex === 'function' ? getCustomerUIDIndex() : 'guest');

        const postId = likeAction.dataset.postId;
        const shopUID = likeAction.dataset.shopUid;
        const likeIcon = likeAction.querySelector('i');  
        const likeCountEl = likeAction.querySelector('.like-count');

        const likeKey = `liked_${userOrGuestUID}_${postId}`;
        const isAlreadyLiked = localStorage.getItem(likeKey);

        const postRef = ref(db, `users/${shopUID}/Posting/${postId}`);

        try {
            const snap = await get(postRef);
            let currentCount = snap.exists() && snap.val().likeCount ? snap.val().likeCount : 0;
            let newCount;

            if (isAlreadyLiked) {
               
                newCount = Math.max(0, currentCount - 1);
                await update(postRef, { likeCount: newCount });

                localStorage.removeItem(likeKey); 
                likeIcon.classList.remove('liked');
                
            } else {
               
                newCount = currentCount + 1;
                await update(postRef, { likeCount: newCount });

                localStorage.setItem(likeKey, 'true');
                likeIcon.classList.add('liked'); 
                
            }

          
            if (likeCountEl) likeCountEl.textContent = newCount;

        } catch (e) {
            console.error("Like Error:", e);
        }
    }
});



function setupVideoPlayer(videoEl) {
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                videoEl.play().catch(error => console.log("Video Play Error:", error));
            } else {
                videoEl.pause();
            }
        });
    }, { threshold: 0.6 }); 
    
    observer.observe(videoEl);
}

function setupPostInteractions(postId, shopUID, isVideo, imageLink2) {
    const mediaContainer = document.querySelector(`#post-${postId} .post-media-container`);
    const mediaEl = document.getElementById(`media-${postId}`);
    if (isVideo) {
        setupVideoPlayer(mediaEl);
    }
    
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                recordPostView(shopUID, postId);
            }
        });
    }, { threshold: 0.5 }); 
    observer.observe(document.getElementById(`post-${postId}`));
   
    if (mediaEl && mediaEl.tagName === 'IMG' && imageLink2) {
        let currentImage = 1;
        mediaEl.addEventListener('click', (event) => {
            currentImage = currentImage === 1 ? 2 : 1;
            mediaEl.src = currentImage === 1 ? mediaEl.src : imageLink2;
            mediaContainer.querySelector('.image-indicator').textContent = `${currentImage}/2`;
            event.stopPropagation(); 
        });
    }

  
    if (mediaContainer) {
        mediaContainer.addEventListener('click', (event) => {
            if (!event.target.closest('.buy-button')) {
                viewMediaHandler(mediaContainer);
            }
        });
    }
}

window.viewMediaHandler = (mediaContainer) => {
    const overlay = document.getElementById('mediaViewerOverlay');
    const mediaWrapper = document.getElementById('viewerMediaWrapper');
    const viewerTextEl = document.getElementById('viewerText');
    const viewerPriceEl = document.getElementById('viewerPrice');
    const postWrapper = mediaContainer.closest('.post-content-wrapper') || mediaContainer.closest('.ad-content-wrapper');
    mediaWrapper.innerHTML = ''; 
    viewerTextEl.innerHTML = '';
    viewerPriceEl.textContent = '';
    
    const mediaEl = mediaContainer.querySelector('.post-media, .ad-media');
    if (!mediaEl) return;
    const mediaType = mediaEl.dataset.mediaType;
    const isProduct = postWrapper.classList.contains('post-content-wrapper');
    
    const text = postWrapper.dataset.text || '';
    const price = postWrapper.dataset.price || '';
    if (text) viewerTextEl.textContent = text;
    if (isProduct && price) viewerPriceEl.innerHTML = `<i class="fas fa-naira-sign"></i> ${price}`;
    
    if (mediaType === 'video') {
        mediaWrapper.innerHTML = `
            <div class="viewer-video-container">
                <video src="${mediaEl.src}" controls autoplay class="viewer-video"></video>
            </div>
        `;
    } else if (mediaType === 'image') {
        mediaWrapper.innerHTML = `<img src="${mediaEl.src}" class="viewer-content" alt="Product Image">`;
    }
    
    overlay.style.display = 'flex';
    document.body.style.overflow = 'hidden'; 
}

            post.style.opacity = '1';
            post.style.transform = 'translateY(0)';

    });
}
