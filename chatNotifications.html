<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEBEJI - Chat History</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
    
        :root {
            --primary-bg: #1A1A2E; 
            --secondary-bg: #252841;
            --text-primary: #E8E8FF;
            --text-secondary: #AAAAAA;
            --accent-green: #00FF99;
            --accent-blue: #4C72D6;
            --danger-red: #E74C3C;
            --unread-highlight: #FFC300; 
            --shadow-light: rgba(255, 255, 255, 0.05);
            --shadow-dark: rgba(0, 0, 0, 0.6);
        }
      
        body {
    background-color: var(--primary-bg);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 0;
    line-height: 1.6;
    font-size: 16px;    
    text-shadow: 3px 4px 4px rgba(0, 0, 0, 0.3);    
    background-color: var(--primary-bg);      
    background-image: 
        linear-gradient(45deg, var(--secondary-bg) 25%, transparent 25%), 
        linear-gradient(-45deg, var(--secondary-bg) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--secondary-bg) 75%),
        linear-gradient(-45deg, transparent 75%, var(--secondary-bg) 75%);        
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;  
    background-image:        
        linear-gradient(rgba(26, 26, 46, 0.7), rgba(26, 26, 46, 0.7)),        
        linear-gradient(45deg, var(--secondary-bg) 25%, transparent 25%), 
        linear-gradient(-45deg, var(--secondary-bg) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--secondary-bg) 75%),
        linear-gradient(-45deg, transparent 75%, var(--secondary-bg) 75%);            
    background-size: 100% 100%, 20px 20px, 20px 20px, 20px 20px, 20px 20px;
    background-position: 0 0, 0 0, 0 10px, 10px -10px, -10px 0px;       
    background-attachment: scroll;        
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    margin: 0;
    overflow-y: auto;
    overflow-x: hidden;
}

       
        .loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #0e0f11, #112233, #1a2b4d, #144b7a); background-size: 400% 400%; animation: gradientMove 7s ease infinite;
            z-index: 999999; opacity: 1; transition: opacity 0.5s ease;
        }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .loader-container { position: relative; width: 150px; height: 150px; display: flex; justify-content: center; align-items: center; }
        .pulse { position: absolute; width: 140px; height: 140px; border-radius: 50%; border: 3px solid #00eaff; animation: pulseAnim 2.5s infinite ease-in-out; opacity: 0.5; }
        @keyframes pulseAnim { 0% { transform: scale(0.6); opacity: 0.4; } 50% { transform: scale(1); opacity: 1; } 100% { transform: scale(0.6); opacity: 0.4; } }
        .logo-wrapper { width: 80px; height: auto; border-radius: 10px; animation: floatLogo 3s infinite ease-in-out; box-shadow: 0 0 10px rgba(0, 234, 255, 0.7); }
        @keyframes floatLogo { 0% { transform: translateY(0); } 50% { transform: translateY(-12px); } 100% { transform: translateY(0); } }
        .orbit { position: absolute; width: 160px; height: 160px; border-radius: 50%; border: 2px dashed #00eaff; animation: spin 5s linear infinite; opacity: 0.3; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .loading-text { position: absolute; bottom: -60px; width: 100%; text-align: center; font-size: 18px; color: #00eaff; letter-spacing: 2px; animation: fadeText 2s infinite; }
        @keyframes fadeText { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }

       
        .chat-history-container {
            width: 100%;
            max-width: 700px; 
            padding: 20px 0;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .chat-history-container.visible {
             opacity: 1;
        }

      
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px 20px 20px;
            border-bottom: 1px solid var(--secondary-bg);
            margin-bottom: 20px;
        }

        .header h2 {
            margin: 0;
            font-size: 1em;
            color: var(--accent-green);
            font-weight: 800;
        }
        
        .home-link {
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 1em;
            transition: color 0.3s;
        }
        .home-link:hover {
            color: var(--accent-green);
        }

       
        #notificationList {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .chat-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            margin-bottom: 12px;
            border-radius: 10px;
            background-color: var(--secondary-bg);
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }
        
        .chat-item:hover {
            transform: scale(1.02);
            background-color: #2D304D;
        }

       
        .chat-item.unread {
            border: 2px solid var(--unread-highlight);
            background-color: #33365C; 
        }
        
        .unread-badge {
            position: absolute;
            top: 10px;
            right: 15px;
            background-color: var(--unread-highlight);
            color: var(--primary-bg);
            font-size: 0.7em;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 12px;
            box-shadow: 0 0 8px var(--unread-highlight);
        }

        .chat-item-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
            border: 3px solid var(--accent-blue);
            flex-shrink: 0;
        }

        .chat-info {
            flex-grow: 1;
            min-width: 0;
        }

        .chat-info h4 {
            margin: 0 0 3px 0;
            font-size: 1.2em;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-info p {
            margin: 0;
            font-size: 0.9em;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-timestamp {
            font-size: 0.8em;
            color: var(--text-secondary);
            text-align: right;
            margin-left: 15px;
            flex-shrink: 0;
        }

        .no-chats {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-secondary);
            font-style: italic;
            background-color: var(--secondary-bg);
            border-radius: 10px;
            margin: 20px;
            box-shadow: 5px 5px 10px var(--shadow-dark);
        }
        .no-chats i {
            color: var(--accent-blue);
            font-size: 36px;
            margin-bottom: 15px;
        }

       
        #notificationContainer { position: fixed; top: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; }
        .notification { }

    </style>
</head>
<body>
    
    <div class="loader-overlay" id="loaderOverlay">
        <div class="loader-container">
            <div class="orbit"></div>
            <div class="pulse"></div>
            <img class="logo-wrapper" src="https://i.imgur.com/MNooQYo.png" alt="BEBEJI Logo" />
            <div class="loading-text">Loading Chats...</div>
        </div>
    </div>

    <div id="notificationContainer"></div>

    <div class="chat-history-container" id="chatHistoryContainer">
        <div class="header">
            <h2><i class="fas fa-comments"></i > Chat History</h2>
            <a href="index.html" class="home-link"><i class="fas fa-home"></i > Go to Home</a>
        </div>
        
        <ul id="notificationList">
            </ul>
        
        <div id="noChatsMessage" class="no-chats" style="display:none;">
            <i class="fas fa-comment-slash"></i>
            <p>You have no previous conversations.</p>
            <p>Start chatting with a shop owner to see history here.</p>
        </div>
    </div>

<script type="module">
import { app } from './firebase.js';
import { getAuth, onAuthStateChanged } from
"https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import {
  getDatabase, ref, get, onValue, off, remove
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

const auth = getAuth(app);
const db = getDatabase(app);

const loaderOverlay = document.getElementById('loaderOverlay');
const chatHistoryContainer = document.getElementById('chatHistoryContainer');
const notificationList = document.getElementById('notificationList');
const noChatsMessage = document.getElementById('noChatsMessage');

const DEFAULT_AVATAR = 'https://i.imgur.com/uT30K2C.png';

let currentUID = null;
let isRegisteredUser = false;

window.showNotification = (msg, type='info') => {
  console.log(type.toUpperCase(), msg);
};


function getCustomerUID() {
  let uid = localStorage.getItem('bebeji_customer_uid');
  if (!uid || !uid.startsWith('GUEST_')) {
    uid = `GUEST_${Date.now()}_${Math.random().toString(36).slice(2,9)}`;
    localStorage.setItem('bebeji_customer_uid', uid);
  }
  return uid;
}

function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return "now";
  if(s<3600) return Math.floor(s/60)+"m";
  if(s<86400) return Math.floor(s/3600)+"h";
  return Math.floor(s/86400)+"d";
}


function hideLoader(){
  loaderOverlay.style.display="none";
  chatHistoryContainer.classList.add('visible');
}


onAuthStateChanged(auth, user=>{
  if(user){
    currentUID = user.uid;
    isRegisteredUser = true;
  }else{
    currentUID = getCustomerUID();
    isRegisteredUser = false;
  }

  if(!currentUID){
    noChatsMessage.style.display="block";
    hideLoader();
    return;
  }

  listenForChatHistory();
});


function listenForChatHistory(){
  const basePath = isRegisteredUser
    ? `users/${currentUID}/chatRooms`
    : `GuestChatRooms/${currentUID}`;

  const chatRoomsRef = ref(db, basePath);
  off(chatRoomsRef);

  onValue(chatRoomsRef, async snap=>{
    notificationList.innerHTML="";
    if(!snap.exists()){
      noChatsMessage.style.display="block";
      hideLoader();
      return;
    }

    const rooms=[];
    snap.forEach(c=>{
      rooms.push({...c.val(), partnerUID:c.key});
    });

    const enriched = await Promise.all(
      rooms.map(r=>enrichRoom(r))
    );

    enriched.sort((a,b)=>{
      if(a.unread!==b.unread) return a.unread?-1:1;
      return (b.timestamp||0)-(a.timestamp||0);
    });

    enriched.forEach(r=>{
      notificationList.appendChild(createChatItem(r));
    });

    hideLoader();
  });
}


async function enrichRoom(room) {
    let name = "User";
    let image = DEFAULT_AVATAR;

    try {
        const snap = await get(ref(db, `users/${room.partnerUID}`));

        if (snap.exists()) {
            const d = snap.val();            
         
            name = d.businesName || 
                   d.businessName || 
                   d['business Name'] || 
                   d.fullName || 
                   d.username || 
                   "Customer";

            image = d.userImageLink || d.profileImageLink || d.shopImageLink || DEFAULT_AVATAR;
        } else {
            name = "Guest Customer";
        }

    } catch (e) {
        console.error("Error enriching room:", e);
    }

    let unread = false;
    if (isRegisteredUser) {
        const n = await get(ref(db, `users/${currentUID}/chatNotifications/${room.partnerUID}`));
        unread = n.exists();
    } else {
        const n = await get(ref(db, `GuestChatNotifications/${currentUID}/${room.partnerUID}`));
        unread = n.exists();
    }

    return { ...room, partnerName: name, partnerImage: image, unread };
}

function createChatItem(room){
  const li = document.createElement('li');
  li.className = `chat-item ${room.unread ? 'unread' : ''}`;

  li.innerHTML = `
    ${room.unread ? `<span class="unread-badge">NEW</span>` : ''}

    <img 
      class="chat-item-avatar"
      src="${room.partnerImage}" 
      onerror="this.src='${DEFAULT_AVATAR}'"
    >

    <div class="chat-info">
      <h4>${room.partnerName}</h4>
      <p>${room.lastMessage || 'Tap to chat'}</p>
    </div>

    <span class="chat-timestamp">
      ${timeAgo(room.timestamp || Date.now())}
    </span>
  `;

  li.onclick = () => openChat(room.partnerUID);
  return li;
}


function openChat(partnerUID) {
  const selfUID = currentUID;

  window.location.href =
    `chat.html?self=${encodeURIComponent(selfUID)}&partner=${encodeURIComponent(partnerUID)}`;
}

</script>
</body>
</html>
