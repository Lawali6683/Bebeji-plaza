<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bebeji Market Search</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>                   
           :root {
            --primary-bg: #1A1A2E;
            --secondary-bg: #2B2B47;
            --text-primary: #E8E8FF;
            --text-secondary: #AAAAAA;
            --accent-green: #00FF99;
            --accent-blue: #4C72D6;
            --shadow-color: rgba(0, 0, 0, 0.7);
        }

        body {
            background-color: var(--primary-bg);
            background-image: linear-gradient(rgba(26, 26, 46, 0.8), rgba(26, 26, 46, 0.8)), 
                              radial-gradient(circle, #2b2b47 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .main-container {
            width: 100%;
            max-width: 600px; 
            padding: 20px;
        }
        
        .search-area {
            position: sticky;
            top: 10px;
            z-index: 100;
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        #searchInput {
            width: 100%;
            padding: 15px 50px 15px 20px;
            border-radius: 30px;
            border: 2px solid var(--accent-blue);
            background-color: #3B3E59;
            color: white;
            font-size: 16px;
            outline: none;
            box-shadow: 0 4px 15px var(--shadow-color);
        }

        .search-icon {
            position: absolute;
            right: 20px;
            color: var(--accent-green);
        }
        
        .card {
            background: var(--secondary-bg);
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
            cursor: pointer;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card:hover { transform: translateY(-5px); border-color: var(--accent-green); }

        .post-image-wrapper {
            position: relative;
            width: 100%;
            height: 250px;
        }

        .post-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-price {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: var(--accent-green);
            color: #000;
            padding: 5px 12px;
            border-radius: 8px;
            font-weight: 800;
        }

        .post-info {
            padding: 15px;
        }

        .post-text {
            font-size: 15px;
            font-weight: 400;
            margin: 0 0 10px 0;
            color: var(--text-primary);
        }

        .shop-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-blue);
            font-size: 13px;
            font-weight: 600;
        }

        #noResultsMessage {
            text-align: center;
            margin-top: 50px;
            color: var(--text-secondary);
        }

        .loader {
            display: none;
            text-align: center;
            margin: 20px;
            color: var(--accent-green);
        }
             
    
.buy-now-btn:active {
    transform: scale(0.95);
}

.card {
    transition: transform 0.3s ease;
    border: 1px solid #eee;
}

.card:hover {
    transform: translateY(-5px);
    border-color: #28a745;
}
   
        
        
        .buy-now-btn {
            background: linear-gradient(135deg, #28a745, #218838);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: background 0.3s;
            width: 100%;
        }

        .buy-now-btn:hover {
            background: linear-gradient(135deg, #218838, #1e7e34);
        }

        .loader {
            display: none;
            text-align: center;
            margin: 20px;
            color: var(--accent-green);
        }

        #noResultsMessage {
            text-align: center;
            padding: 40px;
            color: #888;
        }
    </style>
</head>

<body>
<div class="main-container">
    <h2 style="text-align: center; color: var(--accent-green);">
        <i class="fas fa-shopping-cart"></i> BEBEJI PLAZA MARKET
    </h2>

    <div class="search-area">
        <input type="text" id="searchInput" placeholder="Search product name or price...">
        <i class="fas fa-search search-icon"></i>
    </div>

    <div id="loader" class="loader"><i class="fas fa-spinner fa-spin"></i> Searching database...</div>
    <div id="resultsContainer"></div>
    <div id="noResultsMessage">
        <i class="fas fa-search" style="font-size: 30px; margin-bottom: 10px;"></i>
        <p>Type to search for products.</p>
    </div>
</div>

<script type="module">
    import { app } from './firebase.js';
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

    const db = getDatabase(app);
    const searchInput = document.getElementById('searchInput');
    const resultsContainer = document.getElementById('resultsContainer');
    const noResultsMessage = document.getElementById('noResultsMessage');
    const loader = document.getElementById('loader');
    const DEFAULT_IMAGE = 'https://i.imgur.com/gK9dY9N.png';

    let searchTimeout = null;

    async function executeMarketSearch(term) {
        const queryText = term.toLowerCase().trim();

        if (queryText.length < 1) {
            resultsContainer.innerHTML = '';
            noResultsMessage.style.display = 'block';
            noResultsMessage.innerHTML = `<i class="fas fa-search"></i><p>Type to search for products.</p>`;
            return;
        }

        loader.style.display = 'block';
        noResultsMessage.style.display = 'none';
        resultsContainer.innerHTML = '';

        try {         
            const usersRef = ref(db, 'users');
            const snapshot = await get(usersRef);

            if (snapshot.exists()) {
                let matchFound = false;

                snapshot.forEach((userSnap) => {
                    const shopOwnerUID = userSnap.key; 
                    const userData = userSnap.val();
                    const shopName = userData.businesName || "Bebeji Merchant";

                    if (userData.Posting) {
                        const postings = userData.Posting;                        
                        Object.entries(postings).forEach(([postId, post]) => {
                            const text = (post.text || "").toLowerCase();
                            const price = (post.price || "").toString();

                            if (text.includes(queryText) || price.includes(queryText)) {
                                renderResultCard(post, postId, shopOwnerUID, shopName);
                                matchFound = true;
                            }
                        });
                    }
                });

                if (!matchFound) {
                    noResultsMessage.style.display = 'block';
                    noResultsMessage.innerHTML = `<i class="fas fa-search-minus"></i><p>No products found for "${term}".</p>`;
                }
            }
        } catch (error) {
            console.error("Firebase Search Error:", error);
        } finally {
            loader.style.display = 'none';
        }
    }

    function renderResultCard(post, postId, shopuid, shopName) {
        const formattedPrice = new Intl.NumberFormat('en-NG', {
            style: 'currency', currency: 'NGN', minimumFractionDigits: 0 
        }).format(post.price || 0).replace('NGN', '₦');

        const img = post.imageLink1 || post.imageLink2 || post.giftVideoLink || DEFAULT_IMAGE;
        
        const card = document.createElement('div');
        card.className = 'card';
      
        card.onclick = () => {
            window.location.href = `product.html?shopuid=${shopuid}&productId=${postId}`;
        };

        card.innerHTML = `
            <div class="post-image-wrapper">
                <img class="post-image" src="${img}" onerror="this.src='${DEFAULT_IMAGE}'">
                <span class="post-price">${formattedPrice}</span>
            </div>
            <div class="post-info">
                <p class="post-text">${post.text || 'Product Details'}</p>
                <div class="shop-badge">
                    <i class="fas fa-store"></i> ${shopName}
                </div>
                <button class="buy-now-btn">
                    <i class="fas fa-shopping-cart"></i> Buy Now
                </button>
            </div>
        `;

        resultsContainer.appendChild(card);
    }

    searchInput.addEventListener('input', () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            executeMarketSearch(searchInput.value);
        }, 500);
    });
</script>
</body>
</html>
